<title>Stellar Dominion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Deliberately single-theme: a dark command console. Every color is a token. */
:root{
  color-scheme: dark;
  --ground:#060a14; --panel:rgba(14,21,38,.88); --panel-solid:#0e1526; --panel-2:#141e36;
  --line:#1f2c4a; --line-2:#2e3f66;
  --text:#dde4f4; --muted:#8a96b5; --faint:#5a6789;
  --accent:#f0a93b; --accent-2:#ffc670; --accent-ink:#1b1204;
  --metal:#c3cbdb; --crystal:#6fcbff; --deut:#5fe3b3; --energy:#ffd54a;
  --good:#72dd8f; --bad:#ff6b5e; --hostile:#ff4d6d; --inactive:#7d879f;
  --r:6px;
  --f-display:'Oxanium','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--text);font:14px/1.5 var(--f-body)}
#stars{position:fixed;inset:0;z-index:0;width:100%;height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .small{font-size:12.5px} .block{display:block} .mono{font-family:var(--f-mono)}
.good{color:var(--good)} .bad{color:var(--bad)}
code{font-family:var(--f-mono);font-size:12px;background:var(--panel-2);padding:1px 5px;border-radius:4px}

#app{position:relative;z-index:1;display:grid;grid-template-columns:176px minmax(0,1fr) 224px;grid-template-areas:"top top top" "pause pause pause" "nav main side";
  max-width:1480px;margin:0 auto;padding-inline:16px;column-gap:20px;min-height:100%}
.topbar{grid-area:top;display:flex;align-items:center;gap:16px 24px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(6,10,20,.9);backdrop-filter:blur(8px)}
.brand{font-family:var(--f-display);font-weight:800;letter-spacing:.18em;font-size:15px;line-height:1;white-space:nowrap}
.brand span{display:block;color:var(--accent);font-size:10.5px;letter-spacing:.42em;margin-top:3px}
#resbar{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.res{display:grid;grid-template-columns:auto;min-width:96px;padding:5px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);line-height:1.2}
.res-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.res-val{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.res-rate{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.res.metal .res-val{color:var(--metal)} .res.crystal .res-val{color:var(--crystal)} .res.deut .res-val{color:var(--deut)} .res.energy .res-val{color:var(--energy)}
.res.full .res-val,.res.neg .res-val{color:var(--bad)}
.res.full{border-color:rgba(255,107,94,.45)}
.planet-pick select{background:var(--panel-solid);border:1px solid var(--line-2);border-radius:var(--r);padding:7px 10px;max-width:240px}

#nav{grid-area:nav;display:flex;flex-direction:column;gap:2px;padding-block:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start}
.nav-item{display:flex;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;border-radius:var(--r);padding:8px 12px;
  font-family:var(--f-display);font-weight:500;letter-spacing:.06em;font-size:14px;color:var(--muted);cursor:pointer}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav-item.active{color:var(--accent-ink);background:var(--accent);font-weight:700}
.badge{font-family:var(--f-mono);font-size:11px;background:var(--line-2);color:var(--text);border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.nav-item.active .badge{background:var(--accent-ink);color:var(--accent)}
.badge.hostile{background:var(--hostile);color:#fff}

#main{grid-area:main;padding-block:18px 48px;min-width:0;display:flex;flex-direction:column;gap:14px}
#planets{grid-area:side;padding-block:18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start}
.side-title{font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin:0 0 4px;display:flex;justify-content:space-between}
.planet-item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px 6px 6px;cursor:pointer}
.planet-item b{display:block;font-weight:600;font-size:13px}
.planet-item small{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.planet-item.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)} .dot.hostile{background:var(--hostile);box-shadow:0 0 8px var(--hostile)}
.planet-item.is-moon{margin-left:16px;grid-template-columns:32px 1fr auto}
.planet-item.is-moon img{width:32px;height:32px}
.target-type{margin:8px 0}
.preset{display:inline-flex}
.preset .chip:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.preset .chip.x{border-left:0;border-top-left-radius:0;border-bottom-left-radius:0;padding:4px 9px;color:var(--muted)}
.preset .chip.x:hover{color:var(--bad)}
.trade-row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:8px}
.trade-row label{font-size:12px;color:var(--muted)}
.trade-row input{width:120px}
.msg.news .msg-type{color:var(--accent-2)}
.res.credits .res-val{color:var(--accent-2)}
#pausedBar{display:none;grid-area:pause;align-items:center;gap:10px;margin:12px 0 0;padding:8px 14px;border:1px solid var(--accent);border-radius:var(--r);
  background:rgba(240,169,59,.12);font-size:13px}
body.paused #pausedBar{display:flex}
/* Objectives */
.panel.objective{border-color:rgba(111,203,255,.45);background:linear-gradient(90deg,rgba(111,203,255,.1),var(--panel) 60%)}
.panel.objective p{margin:0 0 8px}
.obj-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.obj-pips{display:flex;gap:3px}
.obj-pips i{width:14px;height:4px;border-radius:2px;background:var(--line-2)}
.obj-pips i.on{background:var(--crystal)}
.howto{margin:0 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
/* Save slots */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.slot{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.slot.active{border-color:var(--accent)}
.slot h3{font-size:13.5px;margin-bottom:4px}
.slot p{margin:0}
/* Officers, factions, achievements */
.card.officer,.card.faction{grid-template-columns:1fr}
.rank-dots{display:flex;gap:5px}
.rank-dots i{width:22px;height:5px;border-radius:3px;background:var(--line-2)}
.rank-dots i.on{background:var(--accent)}
.card.faction.joined{border-color:var(--accent)}
.rep-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:100%;position:relative}
.rep-bar i{display:block;height:100%;background:var(--muted)}
.rep-bar i.ok{background:var(--good)} .rep-bar i.bad{background:var(--bad)}
.ach{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.ach li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);color:var(--muted)}
.ach li.done{color:var(--text)}
.ach li.done b{color:var(--good)}
.ach-reward{font-family:var(--f-mono);font-size:12px;white-space:nowrap;color:var(--accent)}
.ach li.done .ach-reward{color:var(--faint)}
/* History charts: SVG for geometry, HTML for every label */
.charts{display:flex;flex-direction:column;gap:18px}
.chart{margin:0}
.chart .plot{position:relative;padding-left:52px;height:132px}
.chart .plot-area{position:relative;height:100%}
.chart svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .cross{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 3}
.chart .y-tick{position:absolute;left:0;width:46px;text-align:right;transform:translateY(-50%);font-size:10.5px;
  font-family:var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.chart .end-dot{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--panel-solid)}
.chart .x-axis{display:flex;justify-content:space-between;margin:4px 0 0 52px;font-size:10.5px;font-family:var(--f-mono);color:var(--faint)}
.chart figcaption{font-size:12.5px;color:var(--muted);margin:2px 0 0 52px}
.chart figcaption b{color:var(--text);font-family:var(--f-mono)}
.chart .tip{position:absolute;top:-6px;transform:translateX(-50%);background:var(--panel-solid);border:1px solid var(--line-2);border-radius:4px;
  padding:2px 8px;font-size:11.5px;font-family:var(--f-mono);white-space:nowrap;pointer-events:none;z-index:2}
b.metal{color:var(--metal)} b.crystal{color:var(--crystal)} b.deut{color:var(--deut)}
.techs{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:8px}
.tech-in{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.tech-in input{width:52px;padding:3px 6px}
.fleet-grid input[data-sim]{width:88px}

.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:2px 0 0;text-wrap:balance;line-height:1.1}
h2{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;color:var(--text)}
h2 .muted{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:400;font-size:12.5px;margin-left:6px}
h3{margin:0}
.sub{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;display:block}
.coords{font-family:var(--f-mono);font-size:16px;color:var(--muted);font-weight:400}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel.tip{border-color:rgba(240,169,59,.5);background:linear-gradient(90deg,rgba(240,169,59,.12),var(--panel) 60%)}
.panel.tip p{margin:0}
.panel.danger{border-color:rgba(255,107,94,.35)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;
  border-radius:var(--r);padding:7px 14px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--accent-2)}
.btn.dim{background:transparent;color:var(--accent);opacity:.65}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-2)}
.btn.tiny{padding:3px 9px;font-size:12px}
.btn.big{padding:11px 22px;font-size:15px;font-family:var(--f-display);letter-spacing:.06em}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#1a0503}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent-2);cursor:pointer;padding:0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--panel);border-radius:14px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent-2)}
.chip b{font-family:var(--f-mono);color:var(--accent)}
.actions-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}

/* Item cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.card{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);align-items:start}
.card.locked{opacity:.62}
.card.locked:hover{opacity:.9}
.thumb{padding:0;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;cursor:pointer;background:none;line-height:0}
.thumb img{width:88px;height:88px;display:block}
.card-body{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.card h3{font-size:14.5px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lvl{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:400}
.cost{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-mono);font-size:12.5px}
.cost li span{font-family:var(--f-body);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px}
.cost li.metal{color:var(--metal)} .cost li.crystal{color:var(--crystal)} .cost li.deut{color:var(--deut)}
.cost li.short{color:var(--bad)}
.time{margin:0;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.stats{margin:0;display:flex;flex-wrap:wrap;gap:3px 9px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.reqs{list-style:none;margin:4px 0 0;padding:0;font-size:12.5px}
.reqs li.unmet{color:var(--bad)} .reqs li.met{color:var(--good)}
.lock summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.buy{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input[type=number],input:not([type]),textarea,select{background:var(--panel-solid);border:1px solid var(--line-2);border-radius:var(--r);padding:6px 8px;font-family:var(--f-mono);font-size:13px}
.buy input{width:78px}

/* Queues */
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.qlist li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.qlist li>span:first-child{flex:1 1 180px}
.cd{font-family:var(--f-mono);color:var(--accent-2);font-variant-numeric:tabular-nums}
.bar{flex:1 0 100%;height:4px;background:var(--line);border-radius:2px;overflow:hidden;order:9}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width 1s linear}

/* Overview */
.overview{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:20px;align-items:center}
.planet-hero{margin:0;aspect-ratio:1;max-width:100%}
.planet-hero img{width:100%;height:100%;filter:drop-shadow(0 0 30px rgba(110,160,255,.25))}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px;margin:0}
.facts dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.facts dd{margin:2px 0 0;font-family:var(--f-mono);font-size:15px}
.facts.row{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));margin-bottom:12px}
.act-row{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.act-row:first-of-type{border-top:0;padding-top:0}
.act-kind{width:110px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

/* Tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl tfoot th{color:var(--text)}
.tbl.compact td,.tbl.compact th{padding:3px 6px}
.tbl tr.hostile td{background:rgba(255,77,109,.1)}
.tbl tr.me td{background:rgba(240,169,59,.14)}
.tbl tr.here td{background:rgba(240,169,59,.08)}
.tbl tr.gap td{text-align:center;color:var(--faint)}
.tbl tr.sect th{color:var(--accent);padding-top:14px}
.tbl.prod select{padding:2px 4px;font-size:12px}
.tbl.empire td:first-child{white-space:nowrap}
.mini{vertical-align:middle;border-radius:3px;margin-right:6px}
.tbl.events td{white-space:nowrap}
.mission-tag{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--crystal)}
.mission-tag.attack{color:var(--bad)} .mission-tag.hostile{color:var(--hostile)} .mission-tag.expedition{color:var(--accent-2)} .mission-tag.espionage{color:var(--muted)}
.galaxy .gp{display:flex;align-items:center;gap:8px}
.galaxy tr.empty td{color:var(--faint)}
.galaxy tr.deep td{background:rgba(111,203,255,.05)}
.galaxy .acts{display:flex;gap:4px;flex-wrap:wrap;border-bottom:0}
.galaxy td.acts{display:table-cell}
.galaxy .acts .btn{margin:1px}
.debris{font-family:var(--f-mono);color:var(--accent-2)}
.gal-nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.gal-nav input{width:58px}
.legend{margin:0;color:var(--muted)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;border-radius:3px;padding:0 5px;border:1px solid var(--line-2);color:var(--muted);vertical-align:1px}
.tag:empty{display:none}
.tag.inactive{color:var(--inactive)} .tag.aggressive{color:var(--hostile);border-color:rgba(255,77,109,.5)} .tag.you{color:var(--accent);border-color:var(--accent)}
.npc.inactive{color:var(--inactive);font-style:italic}
.npc.weak{color:var(--good)} .npc.strong{color:var(--bad)}
.you{color:var(--accent-2)}

/* Fleet */
.fleet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.fleet-grid input[type=number]{width:90px}
.coords-in{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;max-width:260px}
.coords-in label,.cargo-in label{font-size:12px;color:var(--muted)}
.cargo-in{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;max-width:320px}
.cargo-in label.metal{color:var(--metal)} .cargo-in label.crystal{color:var(--crystal)} .cargo-in label.deut{color:var(--deut)}
.missions{display:flex;flex-direction:column;gap:6px}
.mission{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.mission:has(input:checked){border-color:var(--accent);background:rgba(240,169,59,.08)}
.mission small{display:block;color:var(--muted);font-size:12px}
.mission input{accent-color:var(--accent);margin-top:3px}
.summary{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);border-color:var(--line-2);background:rgba(14,21,38,.97)}

/* Messages */
.messages{display:flex;flex-direction:column;gap:6px}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.msg summary{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 12px;cursor:pointer;list-style:none}
.msg summary::-webkit-details-marker{display:none}
.msg.unread{border-color:var(--line-2)}
.msg.unread .msg-title{font-weight:600;color:#fff}
.msg.unread summary::before{content:'';position:absolute}
.msg-type{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.msg.combat .msg-type{color:var(--bad)} .msg.spy .msg-type{color:var(--crystal)} .msg.expedition .msg-type{color:var(--accent-2)}
.msg time{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.msg-body{padding:4px 14px 12px;border-top:1px solid var(--line)}
.report-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.report-cols h4{margin:6px 0 4px;font-size:13px}
.verdict{font-family:var(--f-display);font-weight:700;letter-spacing:.04em}
.rv{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.rv.metal{color:var(--metal)} .rv.crystal{color:var(--crystal)} .rv.deut{color:var(--deut)}

/* Options & forms */
.form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;max-width:560px}
.form-row label{font-size:12.5px;color:var(--muted)}
.form-row.check{flex-direction:row;align-items:center;gap:8px}
.form-row textarea{width:100%;resize:vertical;font-size:11px}
.form-row select,.form-row input{max-width:200px}

/* Modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(3,5,12,.72);display:grid;place-items:center;padding:16px}
.modal-card{position:relative;background:var(--panel-solid);border:1px solid var(--line-2);border-radius:8px;padding:20px;width:min(560px,100%);max-height:88vh;overflow:auto}
#modalClose{position:absolute;top:10px;right:10px}
.info{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:start;margin-bottom:6px}
.info img{border-radius:6px;border:1px solid var(--line-2);max-width:100%}
.info h2{font-size:20px;text-transform:none;letter-spacing:.02em;margin:2px 0 6px}
.info p{margin:0}

/* Toasts */
#toasts{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(480px,calc(100% - 32px))}
.toast{background:var(--panel-solid);border:1px solid var(--line-2);border-radius:var(--r);padding:9px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:13.5px}
.toast.good{border-color:var(--good)} .toast.bad{border-color:var(--bad)}

/* Start screen */
body.starting #nav,body.starting #planets,body.starting #resbar,body.starting .planet-pick{display:none}
body.starting #main{grid-column:1/-1}
.start{max-width:560px;margin:6vh auto 0;display:flex;flex-direction:column;gap:14px}
.start-title{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,9vw,72px);letter-spacing:.04em;line-height:.95;margin:0;
  background:linear-gradient(180deg,#fff 20%,var(--accent) 120%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:16px;color:var(--muted);margin:0;max-width:52ch}
.start-form{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
.start-form label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:4px}
.start-form input,.start-form select{font-family:var(--f-body);font-size:15px;padding:9px 10px}
.start-form .btn{margin-top:10px}

@media (max-width:1180px){
  #app{grid-template-columns:168px minmax(0,1fr);grid-template-areas:"top top" "pause pause" "nav main"}
  #planets{display:none}
}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "pause" "nav" "main";column-gap:0}
  .topbar{gap:10px}
  .brand span{display:inline;margin-left:6px}
  #resbar{order:3;flex-basis:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr))}
  .res{min-width:0;padding:4px 7px}
  .res-val{font-size:13px}
  .planet-pick{margin-left:auto}
  .planet-pick select{max-width:180px}
  #nav{flex-direction:row;overflow-x:auto;position:static;padding-block:10px 0;gap:4px;scrollbar-width:none}
  .nav-item{flex:none;gap:6px;padding:7px 11px;font-size:13px}
  .overview{grid-template-columns:1fr}
  .planet-hero{max-width:180px;margin:0 auto}
  h1{font-size:24px}
  .msg summary{grid-template-columns:1fr auto}
  .msg-type{grid-column:1/-1}
  .info{grid-template-columns:80px 1fr}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

<script>
'use strict';
/* =====================================================================
 * STELLAR DOMINION — single-player space-empire strategy game (web)
 * ---------------------------------------------------------------------
 * Everything lives in this one file so it can run anywhere:
 *   SECTION: data       – every building / tech / ship / defense
 *   SECTION: utils      – formatting, RNG, small helpers
 *   SECTION: economy    – production, costs, build timers
 *   SECTION: combat     – round-based battle simulator
 *   SECTION: universe   – galaxy + NPC empire generation
 *   SECTION: fleets     – missions, espionage, expeditions, raids
 *   SECTION: engine     – event loop, offline catch-up, saving
 *   SECTION: art        – procedural PLACEHOLDER artwork (swap later)
 *   SECTION: ui         – screens, rendering and input handling
 * Search for "SECTION:" to jump between parts.
 * ===================================================================== */

/* ---------------------------------------------------------------------
 * SECTION: data
 * Balance numbers follow the classic browser-space-game formulas:
 *   cost(level)  = baseCost * factor^(level-1)
 *   hull points  = (metal + crystal) / 10   (structural integrity)
 * Each id (metalMine, lightFighter …) is the stable key used in saves;
 * rename the display `name` freely without breaking old saves.
 * ------------------------------------------------------------------- */

// Universe size. Kept smaller than a real MMO universe so a single
// browser can simulate every NPC planet cheaply.
const GALAXIES = 3, SYSTEMS = 40, POSITIONS = 15;
const EXPEDITION_POS = 16;           // "deep space" slot used only by expeditions
const HOUR = 3600000;                // one hour in ms (game time is real time × speed)
const NPC_TICK_MS = 20 * 60000;      // NPC empires make spending decisions every 20 real minutes
const RES = ['metal', 'crystal', 'deut'];
const RES_LABEL = { metal: 'Metal', crystal: 'Crystal', deut: 'Deuterium', energy: 'Energy' };

// req: { buildingOrTechId: minimumLevel } — keys are checked against the
// planet's buildings first, then the empire-wide research levels.
const BUILDINGS = {
  metalMine:      { name: 'Metal Mine', group: 'resources', cost: [60, 15, 0], f: 1.5,
                    desc: 'Drills and smelts ore from the crust. Metal is the bulk material of every hull, wall and gantry you will ever build.' },
  crystalMine:    { name: 'Crystal Mine', group: 'resources', cost: [48, 24, 0], f: 1.6,
                    desc: 'Grows and harvests lattice crystals used in electronics, optics and alloys. Slower to scale than metal.' },
  deutSynth:      { name: 'Deuterium Synthesizer', group: 'resources', cost: [225, 75, 0], f: 1.5,
                    desc: 'Separates heavy hydrogen from surface water. Fuel for fleets and fusion. Colder worlds yield noticeably more.' },
  solarPlant:     { name: 'Solar Plant', group: 'resources', cost: [75, 30, 0], f: 1.5,
                    desc: 'Arrays of collectors that power the mines. When energy runs short, every mine slows down proportionally.' },
  fusionReactor:  { name: 'Fusion Reactor', group: 'resources', cost: [900, 360, 180], f: 1.8, req: { deutSynth: 5, energyTech: 3 },
                    desc: 'Burns deuterium to make energy. Output improves with Energy Technology.' },
  metalStorage:   { name: 'Metal Silo', group: 'resources', cost: [1000, 0, 0], f: 2,
                    desc: 'Raises how much metal the planet can hold. Mines stop filling a full silo.' },
  crystalStorage: { name: 'Crystal Vault', group: 'resources', cost: [1000, 500, 0], f: 2,
                    desc: 'Raises how much crystal the planet can hold.' },
  deutTank:       { name: 'Deuterium Tank', group: 'resources', cost: [1000, 1000, 0], f: 2,
                    desc: 'Raises how much deuterium the planet can hold.' },
  roboticsFactory:{ name: 'Robotics Factory', group: 'facilities', cost: [400, 120, 200], f: 2,
                    desc: 'Construction drones. Each level shortens building time.' },
  shipyard:       { name: 'Shipyard', group: 'facilities', cost: [400, 200, 100], f: 2, req: { roboticsFactory: 2 },
                    desc: 'Builds ships and planetary defenses. Higher levels unlock larger hulls and build faster.' },
  researchLab:    { name: 'Research Lab', group: 'facilities', cost: [200, 400, 200], f: 2,
                    desc: 'Required for all research. Higher levels research faster and unlock advanced fields.' },

const RESEARCH = {

// drive: which research boosts the ship's speed. speed 0 = cannot fly.
const SHIPS = {
  smallCargo:     { name: 'Light Hauler', cost: [2000, 2000, 0], shield: 10, weapon: 5, speed: 5000, cargo: 5000, fuel: 10, drive: 'combustionDrive',
                    req: { shipyard: 2, combustionDrive: 2 }, desc: 'Fast, cheap freighter. The workhorse of early raids and trade runs.' },
  largeCargo:     { name: 'Heavy Hauler', cost: [6000, 6000, 0], shield: 25, weapon: 5, speed: 7500, cargo: 25000, fuel: 50, drive: 'combustionDrive',
                    req: { shipyard: 4, combustionDrive: 6 }, desc: 'Five times the hold of a Light Hauler. Slow to die, useless in a fight.' },

const MISSILE_IDS = Object.keys(DEFENSE).filter(id => DEFENSE[id].missile);
const isMissile = id => !!(DEFENSE[id] && DEFENSE[id].missile);

/* Officers — hired with Command Credits earned from expeditions and

const OFFICER_MAX = 3;

/* Factions. Each NPC empire belongs to one; you can join the one that
 * likes you enough, for its perk and a standing truce with its members. */
const FACTION_DEFS = [
  { id: 'iron',  name: 'Concord of Iron',  rival: 'chain', perk: '+10% shield strength on everything you own', tag: 'Defensive bloc of old mining houses.' },

const JOIN_REP = 40;

/* Objectives: the guided first hours. One at a time, in order, each with

  { id: 'o10', name: 'Room to grow', hint: 'Research Astrophysics, build a Colony Ark and settle a second planet.', reward: { credits: 300 },

let S = null; // the whole game state (serialised to localStorage)

// Cost of reaching `level` (1-based) of a building or research.
const levelCost = (def, level) => def.cost.map(c => Math.floor(c * def.f ** (level - 1)));

// Officer ranks and faction perks, read through small helpers so the

const off = id => (S.officers && S.officers[id]) || 0;

/* Your combat tech, plus faction perks expressed as multipliers. */
function playerTech() {

}
const techOf = owner => owner === 'player' ? playerTech() : (S.npcs[owner] ? S.npcs[owner].tech : {});
const addCredits = (n, why) => { S.credits = (S.credits || 0) + Math.round(n); if (why) markDirty(); };
const lv = (p, id) => p.buildings[id] || 0;
// Storage scales with universe speed: at ×10 the mines fill ten times

const storageCap = level => 5000 * Math.floor(2.5 * Math.exp(20 * level / 33)) * Math.max(1, S.speed);
const fieldsUsed = p => Object.values(p.buildings).reduce((a, b) => a + b, 0);

const fieldsMax = p => p.isMoon ? 1 + 3 * lv(p, 'lunarBase') : p.fieldsBase + 5 * lv(p, 'terraformer');
// Silo space: 10 slots per level, missiles take 1 (interceptor) or 2 (interplanetary) each.
const siloCapacity = p => 10 * lv(p, 'missileSilo');

const satEnergy = p => Math.max(0, Math.floor((p.tempMax + 140) / 6));

/* Hourly production of a planet (already multiplied by universe speed).
 * Mines need energy: if consumption > supply, every mine runs at
 * supply/consumption efficiency (the "production factor"). */
const ZERO_DETAIL = { eSolar: 0, eFusion: 0, eSats: 0, useM: 0, useC: 0, useD: 0, mineM: 0, mineC: 0, mineD: 0, fusionBurn: 0 };
function production(p) {
  // Moons have no mines, no energy and effectively unlimited storage.
  if (p.isMoon) return { metal: 0, crystal: 0, deut: 0, energyProd: 0, energyUse: 0, factor: 1, detail: ZERO_DETAIL, cap: { metal: 1e13, crystal: 1e13, deut: 1e13 } };
  const tech = techOf(p.owner), spd = S.speed, pct = p.prodPct;
  const m = lv(p, 'metalMine'), c = lv(p, 'crystalMine'), d = lv(p, 'deutSynth');
  const sol = lv(p, 'solarPlant'), fus = lv(p, 'fusionReactor');
  const share = id => (pct[id] ?? 100) / 100;

  const eSolar = 20 * sol * 1.1 ** sol * share('solarPlant');
  const eFusion = 30 * fus * (1.05 + 0.01 * (tech.energyTech || 0)) ** fus * share('fusionReactor');
  const eSats = (p.ships.solarSatellite || 0) * satEnergy(p) * share('solarSatellite');
  const energyProd = Math.floor((eSolar + eFusion + eSats) * (p.owner === 'player' ? 1 + 0.05 * off('engineer') : 1));

  const useM = 10 * m * 1.1 ** m * share('metalMine');
  const useC = 10 * c * 1.1 ** c * share('crystalMine');
  const useD = 20 * d * 1.1 ** d * share('deutSynth');
  const energyUse = Math.ceil(useM + useC + useD);
  const factor = energyUse <= 0 ? 1 : Math.min(1, energyProd / energyUse);

  const plasma = tech.plasmaTech || 0;
  // Quartermaster and the Solar Covenant both lift mine output.
  const boost = p.owner === 'player' ? (1 + 0.05 * off('quartermaster')) * (inFaction('solar') ? 1.08 : 1) : 1;
  const mineM = 30 * m * 1.1 ** m * share('metalMine') * factor * (1 + 0.01 * plasma) * boost;
  const mineC = 20 * c * 1.1 ** c * share('crystalMine') * factor * (1 + 0.0066 * plasma) * boost;
  const mineD = 10 * d * 1.1 ** d * (1.44 - 0.004 * p.tempMax) * share('deutSynth') * factor * (1 + 0.0033 * plasma) * boost;
  const fusionBurn = 10 * fus * 1.1 ** fus * share('fusionReactor');

  return {
    metal: (30 + mineM) * spd,          // 30/h and 15/h base income even with no mines
    crystal: (15 + mineC) * spd,
    deut: (Math.max(0, mineD) - fusionBurn) * spd,
    energyProd, energyUse, factor,
    detail: { eSolar, eFusion, eSats, useM, useC, useD, mineM: mineM * spd, mineC: mineC * spd, mineD: mineD * spd, fusionBurn: fusionBurn * spd },
    cap: { metal: storageCap(lv(p, 'metalStorage')), crystal: storageCap(lv(p, 'crystalStorage')), deut: storageCap(lv(p, 'deutTank')) },
  };
}

// Add resources produced between p.last and t (never beyond storage).
function accrue(p, t) {
  if (t <= p.last) return;
  const hours = (t - p.last) / HOUR;
  const pr = production(p);
  for (const r of RES) {
    const rate = pr[r];
    if (rate >= 0) {
      if (p.res[r] < pr.cap[r]) p.res[r] = Math.min(pr.cap[r], p.res[r] + rate * hours);
    } else {
      p.res[r] = Math.max(0, p.res[r] + rate * hours);
    }
  }
  p.last = t;
}

// Finish any ships/defenses whose build time has elapsed by time t.
function progressShipyard(p, t) {
  while (p.shipQueue.length) {
    const job = p.shipQueue[0];
    if (job.start == null) job.start = t;
    const done = Math.min(job.count, Math.floor((t - job.start) / job.unitTime));
    if (done > 0) {
      const bucket = job.kind === 'ship' ? p.ships : p.defense;
      bucket[job.id] = (bucket[job.id] || 0) + done;
      job.count -= done;
      job.start += done * job.unitTime;
    }
    if (job.count > 0) break;
    p.shipQueue.shift();
    if (p.shipQueue[0]) p.shipQueue[0].start = job.start; // next job starts the instant this one ended
    markDirty();
  }
}
function updatePlanet(p, t) { accrue(p, t); progressShipyard(p, t); }

const canAfford = (p, cost, n = 1) => RES.every((r, i) => p.res[r] >= cost[i] * n - 1e-6);
function pay(p, cost, n = 1) { RES.forEach((r, i) => { p.res[r] -= cost[i] * n; }); }

// Requirements not yet met → [{k, need, have}]
function unmetReqs(p, req) {
  const out = [];
  for (const [k, need] of Object.entries(req || {})) {
    const have = BUILDINGS[k] ? lv(p, k) : (S.research[k] || 0);
    if (have < need) out.push({ k, need, have });
  }
  return out;
}

  return Math.max(1000, h * HOUR / S.speed * engineerFactor());

  const cost = def.cost[rank];
  if ((S.credits || 0) < cost) return fail(`That costs ${fmt(cost)} credits and you have ${fmt(S.credits || 0)}.`);

  for (let guard = 0; guard < 3; guard++) {           // a reward can complete the next one
    const o = currentObjective();
    if (!o) return;
    let done = false;
    try { done = o.test(cur()); } catch (e) { done = false; }
    if (!done) return;
    S.objectives[o.id] = t;

const plannedLevel = (p, id) => lv(p, id) + p.buildQueue.filter(q => q.id === id).length;

// All player actions return {ok:true} or {ok:false, msg} so the UI can show why.
const fail = msg => ({ ok: false, msg });
const OK = { ok: true };

function enqueueBuild(p, id) {
  if (p.buildQueue.length >= 5) return fail('The build queue is full (5 orders).');
  const def = BUILDINGS[id];
  if (p.isMoon && !MOON_BUILDINGS.includes(id)) return fail('That cannot be built on a moon.');
  if (!p.isMoon && def.group === 'moon') return fail('That can only be built on a moon.');
  const level = plannedLevel(p, id) + 1;
  if (unmetReqs(p, def.req).length) return fail('Requirements not met yet.');
  if (id !== 'terraformer' && fieldsUsed(p) + p.buildQueue.length >= fieldsMax(p)) return fail('No free building fields left on this planet.');
  if (id === 'researchLab' && S.researching && S.researching.planet === p.id) return fail('The lab is busy researching. Wait for it to finish.');
  if ((id === 'shipyard' || id === 'naniteFactory') && p.shipQueue.length) return fail('The shipyard is busy. Wait for its queue to finish.');

  if (!canAfford(p, cost)) return fail('Not enough resources.');

function cancelBuild(p, idx) {

  const keep = [];
  p.buildQueue.forEach((q, i) => {

    else keep.push(q);
  });
  const headChanged = idx === 0;
  p.buildQueue = keep;
  if (headChanged && keep[0]) startBuild(p, keep[0], gameNow());
  markDirty();
}

function startResearch(p, id) {
  if (S.researching) return fail('Research is already running. One project at a time.');
  if (!lv(p, 'researchLab')) return fail('This planet has no Research Lab.');
  if (p.buildQueue.some(q => q.id === 'researchLab')) return fail('The lab on this planet is being upgraded.');
  const def = RESEARCH[id];
  const level = (S.research[id] || 0) + 1;
  if (unmetReqs(p, def.req).length) return fail('Requirements not met yet.');
  if (def.energyReq && production(p).energyProd < gravitonEnergy(level)) return fail(`Needs ${fmt(gravitonEnergy(level))} energy production on this planet.`);
  const cost = levelCost(def, level);
  if (!canAfford(p, cost)) return fail('Not enough resources.');
  pay(p, cost);
  const now = gameNow();
  S.researching = { id, level, planet: p.id, cost, start: now, end: now + researchTime(p, id, level) };
  markDirty();
  return OK;
}

  const r = S.researching; if (!r) return;
  const p = S.planets[r.planet];
  if (p) refund(p, r.cost);
  S.researching = null; markDirty();

// How many units the planet can afford right now.
function maxAffordable(p, cost) {
  let n = Infinity;
  RES.forEach((r, i) => { if (cost[i] > 0) n = Math.min(n, Math.floor(p.res[r] / cost[i])); });
  return n === Infinity ? 0 : n;
}

function enqueueUnits(p, id, count) {
  const def = DEF(id), kind = SHIPS[id] ? 'ship' : 'defense';
  if (!lv(p, 'shipyard')) return fail('Build a Shipyard first.');
  if (p.buildQueue[0] && ['shipyard', 'naniteFactory'].includes(p.buildQueue[0].id)) return fail('The shipyard is being upgraded.');
  if (unmetReqs(p, def.req).length) return fail('Requirements not met yet.');
  count = Math.floor(count);
  if (def.max) count = Math.min(count, def.max - (p.defense[id] || 0) - queuedUnits(p, id));
  if (isMissile(id)) {
    if (p.isMoon) return fail('Missiles can only be stored on a planet.');

  count = Math.min(count, maxAffordable(p, def.cost));
  if (!(count > 0)) return fail(def.max ? 'Already built (limit 1 per planet) or not affordable.' : 'Not enough resources.');

  p.shipQueue.push({ id, kind, count, unitTime: unitTime(p, id), start: p.shipQueue.length ? null : gameNow() });

  return { ok: true, count };

/* Travelling merchant: swaps resources at 3 metal : 2 crystal : 1
