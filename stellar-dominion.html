const TRADE_VALUE = { metal: 1, crystal: 1.5, deut: 3 };
const TRADE_FEE = 0.12;
const tradeQuote = (give, get, amount) => Math.floor(Math.max(0, amount) * TRADE_VALUE[give] / TRADE_VALUE[get] * (1 - TRADE_FEE));
function tradeResources(p, give, get, amount) {
  amount = Math.floor(amount);
  if (give === get) return fail('Pick two different resources.');
  if (!(amount > 0)) return fail('Enter an amount to trade.');
  if (p.res[give] < amount) return fail(`Not enough ${RES_LABEL[give].toLowerCase()} on ${p.name}.`);
  const out = tradeQuote(give, get, amount);
  if (out <= 0) return fail('That is too small a load for the merchant to bother with.');
  p.res[give] -= amount; p.res[get] += out;
  markDirty();
  return { ok: true, out };
}

/* ---------------------------------------------------------------------
 * SECTION: combat
 * Up to 6 rounds. Each round every unit fires at a random enemy:
 *  - a shot weaker than 1% of the target's shield bounces off
 *  - shields absorb damage first and fully recharge every round
 *  - a unit below 70% hull may explode with chance 1 - hull/maxHull
 *  - rapid fire can grant extra shots (see RAPIDFIRE)
 * ------------------------------------------------------------------- */
// Missiles never appear in a fleet battle — they are resolved separately.
const COMBAT_IDS = [...Object.keys(SHIPS), ...Object.keys(DEFENSE).filter(id => !isMissile(id))];
const COMBAT_IDX = Object.fromEntries(COMBAT_IDS.map((id, i) => [id, i]));
// RF_TABLE[shooterIdx][targetIdx] = rapid-fire value (0 = none)
const RF_TABLE = COMBAT_IDS.map(id => {
  const row = new Float64Array(COMBAT_IDS.length);
  for (const [t, v] of Object.entries(RAPIDFIRE[id] || {})) row[COMBAT_IDX[t]] = v;
  return row;
});

function buildSide(units, tech) {
  units = Object.fromEntries(Object.entries(units).filter(([id]) => COMBAT_IDX[id] != null));
  let n = 0;
  for (const v of Object.values(units)) n += v || 0;
  const side = { n, type: new Uint8Array(n), hull: new Float64Array(n), shield: new Float64Array(n), st: [] };
  COMBAT_IDS.forEach((id, i) => {
    const d = DEF(id);
    side.st[i] = {
      hull: (d.cost[0] + d.cost[1]) / 10 * (1 + 0.1 * (tech.armourTech || 0)),
      shield: d.shield * (1 + 0.1 * (tech.shieldingTech || 0)) * (tech._shieldMul || 1),
      weapon: d.weapon * (1 + 0.1 * (tech.weaponsTech || 0)) * (tech._weaponMul || 1),
    };
  });
  let k = 0;
  for (const [id, cnt] of Object.entries(units)) {
    const t = COMBAT_IDX[id];
    for (let j = 0; j < (cnt || 0); j++, k++) { side.type[k] = t; side.hull[k] = side.st[t].hull; }
  }
  return side;
}
function fireVolley(att, def, log) {
  const n = att.n;
  for (let i = 0; i < n; i++) {
    const st = att.st[att.type[i]], w = st.weapon, rf = RF_TABLE[att.type[i]];
    if (w <= 0) continue;
    let again = true;
    while (again && def.n > 0) {
      const j = (Math.random() * def.n) | 0, tt = def.type[j], tst = def.st[tt];
      log.shots++;
      if (def.hull[j] > 0) {
        if (w < 0.01 * tst.shield) { log.absorbed += w; }
        else if (w <= def.shield[j]) { def.shield[j] -= w; log.absorbed += w; }
        else {
          log.absorbed += def.shield[j]; log.damage += w - def.shield[j];
          def.hull[j] -= w - def.shield[j]; def.shield[j] = 0;
          if (def.hull[j] > 0 && def.hull[j] < 0.7 * tst.hull && Math.random() > def.hull[j] / tst.hull) def.hull[j] = 0;
        }
      }
      const r = rf[tt];
      again = r > 1 && Math.random() < (r - 1) / r;
    }
  }
}
function compact(side) {
  let k = 0;
  for (let i = 0; i < side.n; i++) {
    if (side.hull[i] > 0) { side.type[k] = side.type[i]; side.hull[k] = side.hull[i]; k++; }
  }
  side.n = k;
}
const countSide = side => {
  const out = {};
  for (let i = 0; i < side.n; i++) { const id = COMBAT_IDS[side.type[i]]; out[id] = (out[id] || 0) + 1; }
  return out;
};
const clean = units => Object.fromEntries(Object.entries(units).filter(([, v]) => v > 0));

function simulateCombat(attUnits, attTech, defUnits, defTech) {
  const A = buildSide(clean(attUnits), attTech), D = buildSide(clean(defUnits), defTech);
  const rounds = [];
  for (let r = 1; r <= 6 && A.n && D.n; r++) {
    for (let i = 0; i < A.n; i++) A.shield[i] = A.st[A.type[i]].shield;
    for (let i = 0; i < D.n; i++) D.shield[i] = D.st[D.type[i]].shield;
    const la = { shots: 0, damage: 0, absorbed: 0 }, ld = { shots: 0, damage: 0, absorbed: 0 };
    fireVolley(A, D, la); fireVolley(D, A, ld);
    compact(A); compact(D);
    rounds.push({ a: la, d: ld, aLeft: A.n, dLeft: D.n });
  }
  const winner = A.n && !D.n ? 'attacker' : D.n && !A.n ? 'defender' : 'draw';
  return { winner, rounds, attAfter: countSide(A), defAfter: countSide(D) };
}
// Value (m, c, d) of a unit bundle; used for losses, debris and points.
function unitsValue(units) {
  const v = [0, 0, 0];
  for (const [id, n] of Object.entries(units)) { const c = DEF(id).cost; v[0] += c[0] * n; v[1] += c[1] * n; v[2] += c[2] * n; }
  return v;
}
function diffUnits(before, after) {
  const lost = {};
  for (const [id, n] of Object.entries(before)) { const l = n - (after[id] || 0); if (l > 0) lost[id] = l; }
  return lost;
}

/* ---------------------------------------------------------------------
 * SECTION: universe
 * Every planet (yours and the NPCs') uses the same data shape, so the
 * same production code runs for everybody.
 * NPC empires come in three temperaments:
 *   inactive   – frozen economy, resources pile up (good raid targets)
 *   active     – keeps upgrading mines and defenses
 *   aggressive – builds warfleets and occasionally raids you
 * ------------------------------------------------------------------- */
const SYL_A = ['Ka', 'Vor', 'Ul', 'Dra', 'Sen', 'Mir', 'Tal', 'Xe', 'Or', 'Bel', 'Qua', 'Ny', 'Ro', 'Ith', 'Zan', 'Hel', 'Cor', 'Ves', 'Ae', 'Lun'];
const SYL_B = ['rik', 'dan', 'thas', 'mora', 'lex', 'vin', 'goth', 'ra', 'tor', 'ssa', 'nox', 'ven', 'dor', 'mir', 'kai', 'lis', 'ron', 'eth', 'zar', 'uun'];
const TITLES = ['Admiral', 'Warden', 'Archon', 'Magistrate', 'Overseer', 'Consul', 'Marshal', 'Regent', 'Prefect', 'Voidlord'];
const PLANET_NAMES = ['Ashfall', 'Brine', 'Cinder', 'Dusk', 'Ember', 'Fathom', 'Glint', 'Harrow', 'Ironreach', 'Jade', 'Kestrel', 'Lumen', 'Mire',
  'Nadir', 'Obsidian', 'Pale', 'Quarry', 'Rime', 'Sable', 'Tidewater', 'Umber', 'Vantage', 'Wick', 'Zenith', 'Cairn', 'Halcyon', 'Ossuary', 'Solace'];

function npcName(rng) {
  const n = SYL_A[(rng() * SYL_A.length) | 0] + SYL_B[(rng() * SYL_B.length) | 0];
  return rng() < 0.45 ? `${TITLES[(rng() * TITLES.length) | 0]} ${n}` : rng() < 0.5 ? n : `${n}-${(rng() * 90 + 10) | 0}`;
}

function makePlanet(owner, g, s, p, rng, name) {
  const [dmin, dmax] = POS_DIAMETER[p];
  const diameter = Math.round((dmin + rng() * (dmax - dmin)) / 100) * 100;
  const pl = {
    id: 'P' + (S.nextId++), owner, name, g, s, p, diameter,
    fieldsBase: Math.floor((diameter / 1000) ** 2),
    tempMax: Math.round(240 - (p - 1) * 26 + (rng() * 40 - 20)),
    seed: Math.floor(rng() * 1e9),
    buildings: {}, ships: {}, defense: {},
    res: { metal: 500, crystal: 500, deut: 0 },
    last: gameNow(),
    prodPct: { metalMine: 100, crystalMine: 100, deutSynth: 100, solarPlant: 100, fusionReactor: 100, solarSatellite: 100 },
    buildQueue: [], shipQueue: [],
  };
  S.planets[pl.id] = pl;
  S.slots[key(g, s, p)] = pl.id;
  return pl;
}
const planetAt = c => S.planets[S.slots[key(c.g, c.s, c.p)]] || null;
const moonAt = c => S.planets[S.moons[key(c.g, c.s, c.p)]] || null;
// A fleet target is a planet, its moon, or the debris field at those coordinates.
const bodyAt = (c, type) => type === 'moon' ? moonAt(c) : planetAt(c);
// Every body you own (planets and moons); playerWorlds() is planets only.
const playerPlanets = () => S.playerPlanets.map(id => S.planets[id]).filter(Boolean);
const playerWorlds = () => playerPlanets().filter(p => !p.isMoon);

/* A moon forms from a debris field after a battle: 1% per 100,000 debris,
 * capped at 20%. Its size decides how many fields a Lunar Base can open up. */
function makeMoon(planet, debrisTotal, t) {
  if (moonAt(planet)) return null;
  const chance = Math.min(0.2, debrisTotal / 1000000);
  if (Math.random() > chance) return null;
  const m = {
    id: 'M' + (S.nextId++), owner: planet.owner, name: planet.name + ' Moon', isMoon: true, parent: planet.id,
    g: planet.g, s: planet.s, p: planet.p, diameter: Math.round(1000 + chance * 30000 + Math.random() * 3000),
    fieldsBase: 0, tempMax: planet.tempMax - 20, seed: (Math.random() * 1e9) | 0,
    buildings: {}, ships: {}, defense: {}, res: { metal: 0, crystal: 0, deut: 0 }, last: t,
    prodPct: {}, buildQueue: [], shipQueue: [],
  };
  S.planets[m.id] = m;
  S.moons[key(m.g, m.s, m.p)] = m.id;
  if (planet.owner === 'player') S.playerPlanets.push(m.id);
  else if (S.npcs[planet.owner]) S.npcs[planet.owner].planets.push(m.id);
  return m;
}
const maxColonies = () => 1 + Math.ceil((S.research.astrophysics || 0) / 2);
const fleetSlots = () => 1 + (S.research.computerTech || 0) + off('admiral');
const expeditionSlots = () => Math.floor(Math.sqrt(S.research.astrophysics || 0)) + Math.floor(off('admiral') / 2);

// Unit mixes NPCs buy, by rough strength tier (0 small … 3 huge).
const NPC_DEF_MIX = [
  [['rocketLauncher', 6], ['lightLaser', 3]],
  [['rocketLauncher', 4], ['lightLaser', 4], ['heavyLaser', 2], ['ionCannon', 1]],
  [['rocketLauncher', 3], ['lightLaser', 3], ['heavyLaser', 2], ['gaussCannon', 2], ['ionCannon', 1]],
  [['rocketLauncher', 3], ['lightLaser', 3], ['heavyLaser', 2], ['gaussCannon', 2], ['plasmaTurret', 1], ['ionCannon', 1]],
];
const NPC_FLEET_MIX = [
  [['lightFighter', 6], ['smallCargo', 2]],
  [['lightFighter', 4], ['heavyFighter', 2], ['cruiser', 2], ['largeCargo', 1]],
  [['lightFighter', 3], ['cruiser', 3], ['battleship', 3], ['largeCargo', 1]],
  [['cruiser', 2], ['battleship', 3], ['battlecruiser', 3], ['destroyer', 1], ['bomber', 1], ['largeCargo', 1]],
];
const tierOf = points => points < 800 ? 0 : points < 8000 ? 1 : points < 60000 ? 2 : 3;

// Spend a resource budget on a weighted mix of units (no time cost for NPCs).
function buyUnits(p, budget, mix, bucketName) {
  const total = mix.reduce((a, [, w]) => a + w, 0);
  for (const [id, w] of mix) {
    const cost = DEF(id).cost, share = w / total;
    let n = Infinity;
    RES.forEach((r, i) => { if (cost[i] > 0) n = Math.min(n, Math.floor(budget[r] * share / cost[i])); });
    if (!isFinite(n) || n <= 0) continue;
    const bucket = p[bucketName];
    bucket[id] = (bucket[id] || 0) + n;
    RES.forEach((r, i) => { budget[r] -= cost[i] * n; });
  }
}
// Raise solar plant until mines have enough energy.
function npcBalanceEnergy(p) {
  let guard = 0;
  while (production(p).factor < 1 && guard++ < 40) p.buildings.solarPlant = lv(p, 'solarPlant') + 1;
}

// Initial development of an NPC planet from the empire's "points" size.
function developNpcPlanet(p, npc, rng) {
  const P = npc.seedPoints;
  const L = clamp(Math.round(1 + 5 * Math.log10(P) + (rng() * 3 - 1.5)), 1, 32);
  p.buildings = {
    metalMine: L, crystalMine: Math.max(0, L - 2), deutSynth: Math.max(0, L - 4),
    roboticsFactory: Math.round(L / 4), shipyard: L > 5 ? Math.round(L / 3) : 0, researchLab: Math.round(L / 4),
    metalStorage: Math.round(L / 5), crystalStorage: Math.round(L / 6), deutTank: Math.round(L / 7), solarPlant: 1,
  };
  npcBalanceEnergy(p);
  const pr = production(p);
  const hours = npc.status === 'inactive' ? 12 + rng() * 60 : 1 + rng() * 10;
  RES.forEach(r => { p.res[r] = Math.min(pr.cap[r], Math.max(0, pr[r]) * hours / S.speed * Math.min(S.speed, 4)); });
  const tier = tierOf(P), budgetTotal = P * 1000;
  const [defShare, fleetShare] = { inactive: [0.12, 0.02], active: [0.25, 0.1], aggressive: [0.15, 0.35] }[npc.status];
  const split = v => ({ metal: v * 0.55, crystal: v * 0.33, deut: v * 0.12 });
  buyUnits(p, split(budgetTotal * defShare / npc.planets.length), NPC_DEF_MIX[tier], 'defense');
  if (fleetShare) buyUnits(p, split(budgetTotal * fleetShare / npc.planets.length), NPC_FLEET_MIX[tier], 'ships');
  if (P > 3000 && rng() < 0.4) p.defense.smallShield = 1;
  if (P > 40000 && rng() < 0.4) p.defense.largeShield = 1;
}

function generateUniverse(seed, homeName) {
  const rng = mulberry32(seed);
  // Pick the player's home slot: galaxy 1, a mid-orbit position.
  const home = { g: 1, s: 1 + ((rng() * SYSTEMS) | 0), p: 4 + ((rng() * 8) | 0) };
  let npcCount = 0;
  const npcList = [];
  for (let g = 1; g <= GALAXIES; g++) {
    for (let s = 1; s <= SYSTEMS; s++) {
      for (let p = 1; p <= POSITIONS; p++) {
        if (g === home.g && s === home.s && p === home.p) continue;
        if (rng() > 0.4) continue; // ~40% of slots are settled
        // Reuse a recent empire in this galaxy sometimes, so empires own several planets.
        let npc = null;
        const local = npcList.filter(n => n.g === g && n.planets.length < 4);
        if (local.length && rng() < 0.3) npc = local[(rng() * local.length) | 0];
        if (!npc) {
          const r = rng();
          const status = r < 0.42 ? 'inactive' : r < 0.9 ? 'active' : 'aggressive';
          // Outer galaxies hold older, stronger empires.
          const seedPoints = 10 ** (1 + rng() ** 1.4 * (2.4 + g * 0.6)) * (status === 'aggressive' ? 2 : 1);
          const fac = rng() < 0.15 ? null : FACTION_DEFS[(rng() * FACTION_DEFS.length) | 0].id;
          npc = { id: 'N' + (++npcCount), name: npcName(rng), status, g, seedPoints, planets: [], tech: {}, faction: fac };
          const t = Math.log10(seedPoints);
          const tl = (mul, spread = 1) => Math.max(0, Math.round(t * mul + (rng() * 2 - 1) * spread));
          npc.tech = { weaponsTech: tl(2), shieldingTech: tl(2), armourTech: tl(2.2), espionageTech: tl(2, 2), energyTech: tl(2),
            combustionDrive: tl(2.2), impulseDrive: tl(1.6), hyperspaceDrive: tl(1.1), plasmaTech: Math.max(0, tl(1.5) - 4), computerTech: tl(2) };
          S.npcs[npc.id] = npc; npcList.push(npc);
        }
        const pl = makePlanet(npc.id, g, s, p, rng, npc.planets.length ? PLANET_NAMES[(rng() * PLANET_NAMES.length) | 0] : 'Capital');
        npc.planets.push(pl.id);
      }
    }
  }
  // Develop after assignment so planet counts are known.
  for (const npc of npcList) {
    for (const id of [...npc.planets]) {
      const pl = S.planets[id];
      developNpcPlanet(pl, npc, rng);
      // Some empires already hold a moon from an old battle.
      if (rng() < 0.12) {
        const saveRandom = Math.random;
        Math.random = rng;                       // makeMoon rolls its own chance
        const m = makeMoon(pl, 1000000, gameNow());
        Math.random = saveRandom;
        if (m) {
          m.buildings = { lunarBase: 1 + ((rng() * 4) | 0), roboticsFactory: (rng() * 4) | 0, shipyard: (rng() * 5) | 0 };
          if (rng() < 0.5) m.buildings.sensorPhalanx = 1 + ((rng() * 3) | 0);
          buyUnits(m, { metal: npc.seedPoints * 60, crystal: npc.seedPoints * 30, deut: npc.seedPoints * 10 }, NPC_DEF_MIX[tierOf(npc.seedPoints)], 'defense');
        }
      }
    }
  }
  // Small debris fields from "old battles" so salvagers have work early on.
  for (let i = 0; i < 25; i++) {
    const c = { g: 1 + ((rng() * GALAXIES) | 0), s: 1 + ((rng() * SYSTEMS) | 0), p: 1 + ((rng() * POSITIONS) | 0) };
    S.debris[key(c.g, c.s, c.p)] = { metal: Math.round(rng() * 20000 * c.g), crystal: Math.round(rng() * 12000 * c.g) };
  }
  // Player home world: fixed 163 fields like a classic start.
  const pl = makePlanet('player', home.g, home.s, home.p, rng, homeName || 'Homeworld');
  pl.fieldsBase = 163; pl.diameter = 12800;
  S.playerPlanets.push(pl.id);
  S.current = pl.id;
}

/* NPC economy tick: active/aggressive empires spend what they produced. */
function npcTick(t) {
  for (const npc of Object.values(S.npcs)) {
    if (npc.status === 'inactive') continue;
    for (const id of npc.planets) {
      const p = S.planets[id]; if (!p || p.isMoon) continue; // moons produce nothing to spend
      updatePlanet(p, t);
      // 1) upgrade the cheapest affordable mine/storage (up to a few times)
      for (let i = 0; i < 6; i++) {
        const pr = production(p);
        let choice = null;
        if (pr.factor < 1) choice = 'solarPlant';
        else {
          const full = RES.find(r => p.res[r] > pr.cap[r] * 0.85);
          choice = full ? { metal: 'metalStorage', crystal: 'crystalStorage', deut: 'deutTank' }[full] : ['metalMine', 'crystalMine', 'deutSynth']
            .filter(k => lv(p, k) < 32)
            .sort((a, b) => levelCost(BUILDINGS[a], lv(p, a) + 1)[0] - levelCost(BUILDINGS[b], lv(p, b) + 1)[0])[0];
        }
        if (!choice) break;
        const cost = levelCost(BUILDINGS[choice], lv(p, choice) + 1);
        if (!canAfford(p, cost)) break;
        pay(p, cost); p.buildings[choice] = lv(p, choice) + 1;
      }
      // 2) spend part of the rest on units
      const tier = tierOf(npc.seedPoints);
      const budget = { metal: p.res.metal * 0.4, crystal: p.res.crystal * 0.4, deut: p.res.deut * 0.3 };
      const spent = { ...budget };
      if (npc.status === 'aggressive' && Math.random() < 0.6) buyUnits(p, budget, NPC_FLEET_MIX[tier], 'ships');
      else buyUnits(p, budget, NPC_DEF_MIX[tier], 'defense');
      RES.forEach(r => { p.res[r] -= spent[r] - budget[r]; });
    }
    // Slow research creep.
    if (Math.random() < 0.04) {
      const k = pick(Object.keys(npc.tech)); npc.tech[k] = (npc.tech[k] || 0) + 1;
    }
    npc.seedPoints *= 1.004; // empires grow a little stronger over time
  }
  npcWars(t);
  npcExpansion(t);
  factionAid(t);
  recordHistory(t);
  // Grudges cool off slowly, and a hot enough grudge turns an empire hostile.
  for (const [id, heat] of Object.entries(S.heat)) {
    const npc = S.npcs[id];
    if (!npc) { delete S.heat[id]; continue; }
    if (heat > 40000 && npc.status !== 'aggressive') {
      npc.status = 'aggressive';
      addMessage('news', `${esc(npc.name)} has declared a vendetta`, `<p>After your raids on their planets, <b>${esc(npc.name)}</b> has turned its economy to war. Expect their fleets at your coordinates.</p>`, t);
    }
    S.heat[id] = heat * 0.97;
    if (S.heat[id] < 100) delete S.heat[id];
  }
  S.nextNpcTick = t + NPC_TICK_MS;
}

/* NPC empires fight each other, so rankings, debris and moons keep
 * moving even while you are only building mines. Battles resolve
 * instantly — no flight is simulated for AI-versus-AI raids. */
function npcWars(t) {
  const aggressors = Object.values(S.npcs).filter(n => n.status === 'aggressive');
  let newsBudget = 1; // at most one headline per tick, so the inbox stays readable
  for (const npc of aggressors) {
    if (Math.random() > 0.25) continue;
    const base = npc.planets.map(id => S.planets[id]).filter(p => p && shipCount(p.ships) > 5)[0];
    if (!base) continue;
    // Look for a softer neighbour in the same galaxy.
    let target = null;
    for (let tries = 0; tries < 12 && !target; tries++) {
      const s = clamp(base.s + ((Math.random() * 16) | 0) - 8, 1, SYSTEMS);
      const cand = planetAt({ g: base.g, s, p: 1 + ((Math.random() * POSITIONS) | 0) });
      if (cand && cand.owner !== 'player' && cand.owner !== npc.id) target = cand;
    }
    if (!target) continue;
    updatePlanet(target, t);
    const fleet = {};
    for (const [id, n] of Object.entries(base.ships)) { const send = Math.floor(n * 0.6); if (send > 0) fleet[id] = send; }
    if (!shipCount(fleet)) continue;
    const defUnits = { ...clean(target.ships), ...Object.fromEntries(Object.entries(clean(target.defense)).filter(([id]) => !isMissile(id))) };
    const r = simulateCombat(fleet, npc.tech, defUnits, techOf(target.owner));
    // Apply the outcome to both sides.
    for (const [id, n] of Object.entries(diffUnits(fleet, r.attAfter))) base.ships[id] = Math.max(0, (base.ships[id] || 0) - n);
    const defLost = diffUnits(defUnits, r.defAfter);
    for (const [id, n] of Object.entries(defLost)) {
      if (DEFENSE[id]) target.defense[id] = Math.max(0, (target.defense[id] || 0) - n + Math.round(n * 0.7));
      else target.ships[id] = Math.max(0, (target.ships[id] || 0) - n);
    }
    let debris = 0;
    for (const lost of [diffUnits(fleet, r.attAfter), defLost]) for (const [id, n] of Object.entries(lost)) if (SHIPS[id]) debris += (SHIPS[id].cost[0] + SHIPS[id].cost[1]) * n * 0.3;
    if (debris > 0) {
      const k = key(target.g, target.s, target.p), d = S.debris[k] || (S.debris[k] = { metal: 0, crystal: 0 });
      d.metal += debris * 0.6; d.crystal += debris * 0.4;
    }
    let loot = 0;
    if (r.winner === 'attacker') {
      RES.forEach(res => { const take = target.res[res] * 0.5; target.res[res] -= take; base.res[res] += take; loot += take; });
    }
    const moon = makeMoon(target, debris, t);
    if (newsBudget > 0 && reportNews(npc, target, r.winner, debris, loot, moon, t)) newsBudget--;
  }
}
// Only battles the player could plausibly care about become news.
function reportNews(npc, target, winner, debris, loot, moon, t) {
  const near = playerPlanets().some(p => p.g === target.g && Math.abs(p.s - target.s) <= 8);
  const big = debris > 300000;
  if (!(near || big) || Math.random() > 0.4) return false;
  addMessage('news', `${esc(npc.name)} raided ${esc(ownerName(target.owner))} ${coordStr(target)}`, `
    <p><b>${esc(npc.name)}</b> ${winner === 'attacker' ? 'overran' : winner === 'draw' ? 'traded blows with' : 'was beaten back at'} ${esc(target.name)} ${coordStr(target)}.</p>
    ${debris > 0 ? `<p>Debris left in orbit: ${fmtShort(debris)} — free for any Salvager that gets there first.</p>` : ''}
    ${loot > 0 ? `<p>Plunder taken: ${fmtShort(loot)} resources.</p>` : ''}
    ${moon ? '<p>The wreckage condensed into a new moon.</p>' : ''}`, t);
  return true;
}

/* Active empires occasionally settle an empty slot next door. */
function npcExpansion(t) {
  // Leave room for your own colonies: expansion stops once the universe is busy.
  if (Object.keys(S.slots).length > GALAXIES * SYSTEMS * POSITIONS * 0.55) return;
  const movers = Object.values(S.npcs).filter(n => n.status !== 'inactive' && n.planets.filter(id => S.planets[id] && !S.planets[id].isMoon).length < 4);
  for (const npc of movers) {
    if (Math.random() > 0.02) continue;
    const home = S.planets[npc.planets[0]];
    if (!home) continue;
    const s = clamp(home.s + ((Math.random() * 7) | 0) - 3, 1, SYSTEMS);
    const pos = 1 + ((Math.random() * POSITIONS) | 0);
    if (planetAt({ g: home.g, s, p: pos })) continue;
    const pl = makePlanet(npc.id, home.g, s, pos, Math.random, PLANET_NAMES[(Math.random() * PLANET_NAMES.length) | 0]);
    npc.planets.push(pl.id);
    developNpcPlanet(pl, { ...npc, seedPoints: npc.seedPoints * 0.35 }, Math.random);
  }
}

/* Your faction ships you supplies now and then. */
function factionAid(t) {
  if (!S.faction || Math.random() > 0.08) return;
  const p = pick(playerWorlds());
  if (!p) return;
  updatePlanet(p, t);
  const base = Math.max(20000, scoreOf('player') * 120);
  const gift = { metal: Math.round(base * rand(0.4, 0.8)), crystal: Math.round(base * rand(0.2, 0.5)), deut: Math.round(base * rand(0.05, 0.2)) };
  RES.forEach(r => { p.res[r] += gift[r]; });
  addMessage('news', `${esc(FACTION[S.faction].name)} sent supplies`, `<p>A convoy unloaded at ${esc(p.name)} ${coordStr(p)}: ${resLine(gift)}.</p>`, t);
}

/* A snapshot every tick, so the Standing screen can draw real history. */
function recordHistory(t) {
  const fleetVal = playerPlanets().reduce((a, p) => { const v = unitsValue(p.ships); return a + v[0] + v[1] + v[2]; }, 0)
    + S.fleets.filter(f => f.owner === 'player').reduce((a, f) => { const v = unitsValue(f.ships); return a + v[0] + v[1] + v[2]; }, 0);
  const me = rankings(true).find(e => e.id === 'player');
  S.history.push({ t, points: me ? me.points : 0, rank: me ? me.rank : 0, fleet: Math.round(fleetVal) });
  if (S.history.length > 400) S.history.shift();
}

/* Points = total resources invested / 1000 (buildings, research, units). */
function pointsOfPlanet(p) {
  let tot = 0;
  for (const [id, l] of Object.entries(p.buildings)) tot += cumCost(BUILDINGS[id], l);
  for (const bucket of [p.ships, p.defense]) for (const [id, n] of Object.entries(bucket)) { const c = DEF(id).cost; tot += (c[0] + c[1] + c[2]) * n; }
  return tot;
}
function scoreOf(owner) {
  let tot = 0;
  const ids = owner === 'player' ? S.playerPlanets : S.npcs[owner].planets;
  for (const id of ids) if (S.planets[id]) tot += pointsOfPlanet(S.planets[id]);
  const tech = techOf(owner);
  for (const [id, l] of Object.entries(tech)) if (RESEARCH[id]) tot += cumCost(RESEARCH[id], l);
  if (owner === 'player') for (const f of S.fleets) if (f.owner === 'player') { const v = unitsValue(f.ships); tot += v[0] + v[1] + v[2]; }
  return Math.floor(tot / 1000);
}
let _rankCache = { t: 0, list: [] };
function rankings(force) {
  if (!force && gameNow() - _rankCache.t < 15000 && _rankCache.list.length) return _rankCache.list;
  const list = Object.values(S.npcs).map(n => ({ id: n.id, name: n.name, status: n.status, points: scoreOf(n.id), planets: n.planets.length }));
  list.push({ id: 'player', name: S.commander, status: 'player', points: scoreOf('player'), planets: S.playerPlanets.length });
  list.sort((a, b) => b.points - a.points);
  list.forEach((e, i) => { e.rank = i + 1; });
  _rankCache = { t: gameNow(), list };
  return list;
}
const npcPoints = id => { const e = rankings().find(x => x.id === id); return e ? e.points : 0; };

/* ---------------------------------------------------------------------
 * SECTION: fleets
 * Flight model:
 *   distance: other galaxy 20000·Δg | other system 2700+95·Δs
 *             same system 1000+5·Δp | same slot 5
 *   seconds  = 10 + 35000/speed% · √(10·distance / slowestShipSpeed)
 *   (divided by universe speed)
 * ------------------------------------------------------------------- */
function distance(a, b) {
  if (a.g !== b.g) return 20000 * Math.abs(a.g - b.g);
  if (a.s !== b.s) return 2700 + 95 * Math.abs(a.s - b.s);
  if (a.p !== b.p) return 1000 + 5 * Math.abs(a.p - b.p);
  return 5;
}
function shipSpeed(id, tech) {
  const d = SHIPS[id];
  if (!d.drive) return 0;
  return d.speed * (1 + DRIVE_BONUS[d.drive] * (tech[d.drive] || 0));
}
function slowestSpeed(ships, tech) {
  let v = Infinity;
  for (const [id, n] of Object.entries(ships)) if (n > 0) v = Math.min(v, shipSpeed(id, tech));
  return v;
}
function flightTime(dist, slowest, pct) {
  const sec = 10 + (35000 / pct) * Math.sqrt(dist * 10 / slowest);
  return Math.max(1000, sec * 1000 / S.speed);
}
function fuelCost(ships, dist, pct) {
  let f = 0;
  for (const [id, n] of Object.entries(ships)) if (n > 0) f += SHIPS[id].fuel * n * dist / 35000 * (pct / 100 + 1) ** 2;
  return Math.max(1, Math.round(f) + 1);
}
// Verge Syndicate members fit more into the same holds.
const cargoCap = ships => Object.entries(ships).reduce((a, [id, n]) => a + (id === 'espionageProbe' ? 0 : SHIPS[id].cargo * n), 0) * (inFaction('verge') ? 1.1 : 1);
const shipCount = ships => Object.values(ships).reduce((a, b) => a + (b || 0), 0);
const ownerName = o => o === 'player' ? S.commander : o === 'pirates' ? 'Pirate Raiders' : o === 'aliens' ? 'Unknown Armada' : (S.npcs[o] ? S.npcs[o].name : 'Unknown');

// Missions that make sense for a target, given the fleet and target type
// ('planet', 'moon' or 'debris').
function missionsFor(origin, target, ships, type = 'planet') {
  const has = id => (ships[id] || 0) > 0;
  const onlyProbes = has('espionageProbe') && Object.entries(ships).every(([id, n]) => id === 'espionageProbe' || !n);
  const out = [];
  if (target.p === EXPEDITION_POS) return ['expedition'];
  if (type === 'debris') {
    const d = S.debris[key(target.g, target.s, target.p)];
    return d && d.metal + d.crystal > 0 && has('recycler') ? ['recycle'] : [];
  }
  const tp = bodyAt(target, type);
  if (tp) {
    if (tp.owner === 'player') { if (!origin || tp.id !== origin.id) out.push('transport', 'deploy'); }
    else { if (onlyProbes) out.push('espionage'); else out.push('attack', 'transport'); }
  } else if (type === 'planet' && has('colonyShip')) out.push('colonize');
  return out;
}

// Validate and launch a fleet from planet p. form = {ships, g, s, p, mission, speed, cargo}
function launchFleet(p, form) {
  const ships = clean(form.ships || {});
  const target = { g: +form.g, s: +form.s, p: +form.p };
  const now = gameNow();
  updatePlanet(p, now);
  if (!shipCount(ships)) return fail('Select at least one ship.');
  for (const [id, n] of Object.entries(ships)) {
    if (!SHIPS[id].speed) return fail(`${SHIPS[id].name} cannot fly.`);
    if ((p.ships[id] || 0) < n) return fail(`Not enough ${SHIPS[id].name} on this planet.`);
  }
  if (!(target.g >= 1 && target.g <= GALAXIES && target.s >= 1 && target.s <= SYSTEMS && target.p >= 1 && target.p <= EXPEDITION_POS)) return fail('Those coordinates are outside the universe.');
  const type = form.type || 'planet';
  if (target.g === p.g && target.s === p.s && target.p === p.p && (type === 'planet') === !p.isMoon) return fail('The fleet is already there.');
  const valid = missionsFor(p, target, ships, type);
  if (!valid.includes(form.mission)) return fail('That mission is not possible for this target and fleet.');
  const mine = S.fleets.filter(f => f.owner === 'player');
  if (mine.length >= fleetSlots()) return fail(`All ${fleetSlots()} fleet slots are in use. Research Computer Technology for more.`);
  if (form.mission === 'expedition') {
    if (!expeditionSlots()) return fail('Expeditions need Astrophysics.');
    if (mine.filter(f => f.mission === 'expedition').length >= expeditionSlots()) return fail('All expedition slots are in use.');
  }
  if (form.mission === 'colonize' && playerWorlds().length >= maxColonies()) return fail(`Astrophysics limits you to ${maxColonies()} planets. Research more to colonize.`);
  let pct = clamp(+form.speed || 100, 10, 100);
  const dist = distance(p, target);
  const tech = S.research;
  let duration = flightTime(dist, slowestSpeed(ships, tech), pct);
  // Joint attack: slow this fleet down so it lands with the one already in flight.
  if (form.join) {
    const lead = S.fleets.find(x => x.id === form.join && x.owner === 'player' && x.state === 'outbound');
    if (!lead) return fail('That fleet is no longer on its way.');
    const needed = lead.arrive - now;
    const fastest = flightTime(dist, slowestSpeed(ships, tech), 100);
    if (fastest > needed) return fail(`Too slow to catch it: the fastest this fleet can get there is ${fmtDur(fastest)}, and the attack lands in ${fmtDur(needed)}.`);
    const sec = needed * S.speed / 1000;
    pct = clamp(Math.ceil(35000 * Math.sqrt(dist * 10 / slowestSpeed(ships, tech)) / Math.max(1, sec - 10)), 10, 100);
    duration = needed;
  }
  const fuel = fuelCost(ships, dist, pct);
  const cargo = { metal: Math.max(0, Math.floor(+form.cargo?.metal || 0)), crystal: Math.max(0, Math.floor(+form.cargo?.crystal || 0)), deut: Math.max(0, Math.floor(+form.cargo?.deut || 0)) };
  if (cargo.metal + cargo.crystal + cargo.deut > cargoCap(ships)) return fail('The cargo exceeds the fleet\'s hold.');
  if (cargo.metal > p.res.metal || cargo.crystal > p.res.crystal) return fail('Not enough resources to load.');
  if (cargo.deut + fuel > p.res.deut) return fail(`Not enough deuterium: the flight needs ${fmt(fuel)} fuel plus cargo.`);
  for (const [id, n] of Object.entries(ships)) p.ships[id] -= n;
  p.res.metal -= cargo.metal; p.res.crystal -= cargo.crystal; p.res.deut -= cargo.deut + fuel;
  S.fleets.push({
    id: 'F' + (S.nextId++), owner: 'player', mission: form.mission,
    from: { g: p.g, s: p.s, p: p.p }, fromId: p.id, to: target, targetType: type, ships, cargo,
    depart: now, arrive: now + duration, oneWay: duration, state: 'outbound', speed: pct,
  });
  markDirty();
  return OK;
}

function recallFleet(id) {
  const f = S.fleets.find(x => x.id === id);
  if (!f || f.owner !== 'player' || f.state === 'return') return;
  const now = gameNow();
  const back = f.state === 'hold' ? f.oneWay : now - f.depart;
  f.state = 'return'; f.depart = now; f.arrive = now + back;
  markDirty();
}
function startReturn(f, t, extra = 1) {
  f.state = 'return'; f.depart = t; f.arrive = t + f.oneWay * extra;
}

/* Messages ----------------------------------------------------------- */
function addMessage(type, title, body, t = gameNow()) {
  const m = { id: 'M' + (S.nextId++), t, type, title, body, read: false };
  S.messages.unshift(m);
  if (S.messages.length > 400) S.messages.length = 400;
  markDirty();
  return m;
}
const resLine = o => RES.map(r => `<span class="rv ${r}">${RES_LABEL[r]} ${fmt(o[r] || 0)}</span>`).join(' ');
function unitsTable(before, after) {
  const ids = COMBAT_IDS.filter(id => before[id]);
  if (!ids.length) return '<p class="muted">No units.</p>';
  return `<table class="tbl compact"><thead><tr><th>Unit</th><th class="num">Before</th><th class="num">Lost</th><th class="num">After</th></tr></thead><tbody>${
    ids.map(id => `<tr><td>${esc(DEF(id).name)}</td><td class="num">${fmt(before[id])}</td><td class="num bad">${fmt(before[id] - (after[id] || 0)) || ''}</td><td class="num">${fmt(after[id] || 0)}</td></tr>`).join('')
  }</tbody></table>`;
}
const techLine = t => `Weapons ${t.weaponsTech || 0} · Shields ${t.shieldingTech || 0} · Armour ${t.armourTech || 0}`;

/* Combat at a planet: fleet f attacks planet tp at time t. */
function battleAtPlanet(f, tp, t) {
  updatePlanet(tp, t);
  const attTech = techOf(f.owner), defTech = techOf(tp.owner);
  const defBefore = { ...clean(tp.ships), ...Object.fromEntries(Object.entries(clean(tp.defense)).filter(([id]) => !isMissile(id))) };
  const attBefore = { ...f.ships };
  const r = simulateCombat(attBefore, attTech, defBefore, defTech);
  // Apply losses. Defenses have a 70% chance per unit to be rebuilt.
  const defLost = diffUnits(defBefore, r.defAfter), attLost = diffUnits(attBefore, r.attAfter);
  const rebuilt = {};
  for (const [id, n] of Object.entries(defLost)) {
    if (DEFENSE[id]) {
      let k = 0;
      if (n <= 30) { for (let i = 0; i < n; i++) if (Math.random() < 0.7) k++; }
      else k = Math.round(n * rand(0.65, 0.75));
      if (k) rebuilt[id] = k;
      tp.defense[id] = (tp.defense[id] || 0) - n + k;
    } else tp.ships[id] = (tp.ships[id] || 0) - n;
  }
  f.ships = clean(r.attAfter);
  // Debris: 30% of metal & crystal of destroyed SHIPS (not defenses).
  // A Geologist squeezes a little more out of the wreckage.
  const dShare = 0.3 + (f.owner === 'player' ? 0.05 * off('geologist') : 0);
  const debris = { metal: 0, crystal: 0 };
  for (const lost of [attLost, defLost]) for (const [id, n] of Object.entries(lost)) if (SHIPS[id]) {
    debris.metal += SHIPS[id].cost[0] * n * dShare; debris.crystal += SHIPS[id].cost[1] * n * dShare;
  }
  debris.metal = Math.floor(debris.metal); debris.crystal = Math.floor(debris.crystal);
  if (debris.metal + debris.crystal > 0) {
    const k = key(tp.g, tp.s, tp.p), d = S.debris[k] || (S.debris[k] = { metal: 0, crystal: 0 });
    d.metal += debris.metal; d.crystal += debris.crystal;
  }
  // Plunder: winner hauls up to 50% of each resource, limited by cargo space.
  const loot = { metal: 0, crystal: 0, deut: 0 };
  if (r.winner === 'attacker') {
    let cap = cargoCap(f.ships) - (f.cargo.metal + f.cargo.crystal + f.cargo.deut);
    const share = f.owner === 'player' && inFaction('verge') ? 0.575 : 0.5; // Syndicate takes a bigger cut
    const av = { metal: tp.res.metal * share, crystal: tp.res.crystal * share, deut: tp.res.deut * share };
    const take = (r, amt) => { const a = Math.max(0, Math.floor(Math.min(amt, av[r] - loot[r], cap))); loot[r] += a; cap -= a; };
    take('metal', cap / 3); take('crystal', cap / 2); take('deut', cap);
    take('metal', cap / 2); take('crystal', cap); take('metal', cap);
    RES.forEach(r => { tp.res[r] -= loot[r]; f.cargo[r] += loot[r]; });
  }
  // Debris can condense into a moon over the planet (never over a moon).
  let moon = null;
  if (!tp.isMoon) moon = makeMoon(tp, debris.metal + debris.crystal, t);
  const lossVal = u => { const v = unitsValue(u); return v[0] + v[1] + v[2]; };
  // Raiding an empire makes it hold a grudge; enough grudge turns it hostile.
  if (f.owner === 'player' && S.npcs[tp.owner]) {
    const taken = loot.metal + loot.crystal + loot.deut;
    S.heat[tp.owner] = (S.heat[tp.owner] || 0) + lossVal(defLost) + taken;
    S.stats.destroyed += lossVal(defLost);
    S.stats.plundered += taken;
    if (r.winner === 'attacker') S.stats.battlesWon++;
    adjustRep(S.npcs[tp.owner].faction, -(lossVal(defLost) + taken) / 20000, t);
  }
  if (tp.owner === 'player' && r.winner === 'defender') { S.stats.battlesWon++; S.stats.destroyed += lossVal(attLost); }
  const playerAttacked = tp.owner === 'player';
  const verdict = r.winner === 'draw' ? 'The battle ended in a draw.' :
    (r.winner === 'attacker') === !playerAttacked ? 'Victory — your forces hold the field.' : 'Defeat — your forces were beaten.';
  const body = `
    <p class="verdict ${(r.winner === 'attacker') === !playerAttacked && r.winner !== 'draw' ? 'good' : r.winner === 'draw' ? '' : 'bad'}">${verdict} (${r.rounds.length} round${r.rounds.length === 1 ? '' : 's'})</p>
    <div class="report-cols">
      <section><h4>Attacker · ${esc(ownerName(f.owner))} <span class="muted">${coordStr(f.from)}</span></h4><p class="muted small">${techLine(attTech)}</p>${unitsTable(attBefore, r.attAfter)}</section>
      <section><h4>Defender · ${esc(ownerName(tp.owner))} <span class="muted">${coordStr(tp)}</span></h4><p class="muted small">${techLine(defTech)}</p>${unitsTable(defBefore, r.defAfter)}
      ${Object.keys(rebuilt).length ? `<p class="small">Rebuilt: ${Object.entries(rebuilt).map(([id, n]) => `${fmt(n)} ${esc(DEF(id).name)}`).join(', ')}</p>` : ''}</section>
    </div>
    <p>Attacker lost ${fmtShort(lossVal(attLost))} resources worth of units · Defender lost ${fmtShort(lossVal(defLost))}.</p>
    ${r.winner === 'attacker' ? `<p>Plunder: ${resLine(loot)}</p>` : ''}
    ${debris.metal + debris.crystal ? `<p>A debris field forms: <span class="rv metal">Metal ${fmt(debris.metal)}</span> <span class="rv crystal">Crystal ${fmt(debris.crystal)}</span></p>` : ''}
    ${moon ? `<p class="verdict good">The debris condensed into a moon (${fmt(moon.diameter)} km) for ${esc(ownerName(moon.owner))}.</p>` : ''}
    ${f.owner === 'player' ? `<p class="actions-row">
      <button class="btn ghost" data-act="fleetTo" data-g="${tp.g}" data-s="${tp.s}" data-p="${tp.p}" data-type="${tp.isMoon ? 'moon' : 'planet'}" data-mission="attack">Attack again</button>
      ${debris.metal + debris.crystal ? `<button class="btn ghost" data-act="fleetTo" data-g="${tp.g}" data-s="${tp.s}" data-p="${tp.p}" data-type="debris" data-mission="recycle">Harvest the debris</button>` : ''}</p>` : ''}`;
  addMessage('combat', `Combat at ${esc(tp.name)} ${coordStr(tp)}`, body, t);
  return r;
}

/* Espionage report. Info revealed grows with probes and tech lead. */
function espionage(f, tp, t) {
  updatePlanet(tp, t);
  const n = f.ships.espionageProbe || 0;
  const d = (S.research.espionageTech || 0) - (techOf(tp.owner).espionageTech || 0);
  const info = n + Math.sign(d) * d * d + off('spymaster'); // the Spymaster reads between the lines
  const sect = (title, obj, ids) => {
    const rows = ids.filter(id => obj[id]).map(id => `<tr><td>${esc(DEF(id).name)}</td><td class="num">${fmt(obj[id])}</td></tr>`).join('');
    return `<section><h4>${title}</h4>${rows ? `<table class="tbl compact"><tbody>${rows}</tbody></table>` : '<p class="muted small">None</p>'}</section>`;
  };
  const loot = { metal: tp.res.metal / 2, crystal: tp.res.crystal / 2, deut: tp.res.deut / 2 };
  const lootTotal = loot.metal + loot.crystal + loot.deut;
  let body = `<p>${esc(tp.name)} ${coordStr(tp)} · owner <b>${esc(ownerName(tp.owner))}</b>${S.npcs[tp.owner] ? ` <span class="tag ${S.npcs[tp.owner].status}">${S.npcs[tp.owner].status}</span>` : ''}</p>
    <p>${resLine(tp.res)}</p>
    <p class="small muted">Lootable (50%): ${fmtShort(lootTotal)} → about ${fmt(Math.ceil(lootTotal / 5000))} Light Haulers or ${fmt(Math.ceil(lootTotal / 25000))} Heavy Haulers.</p>
    <div class="report-cols">`;
  body += info >= 2 ? sect('Fleet', tp.ships, Object.keys(SHIPS)) : '<section><h4>Fleet</h4><p class="muted small">Send more probes to see fleets.</p></section>';
  body += info >= 3 ? sect('Defense', tp.defense, Object.keys(DEFENSE)) : '<section><h4>Defense</h4><p class="muted small">Not revealed (needs 3+ info).</p></section>';
  body += info >= 5 ? sect('Buildings', tp.buildings, Object.keys(BUILDINGS)) : '';
  body += info >= 7 ? sect('Research', techOf(tp.owner), Object.keys(RESEARCH)) : '';
  body += `</div><p class="actions-row"><button class="btn" data-act="fleetTo" data-g="${tp.g}" data-s="${tp.s}" data-p="${tp.p}" data-type="${tp.isMoon ? 'moon' : 'planet'}" data-mission="attack">Attack</button>
    ${info >= 3 ? `<button class="btn ghost" data-act="simFrom" data-id="SIMID">Simulate this battle</button>` : ''}</p>`;
  // Counter-espionage: enemy ships may catch the probes.
  const defShips = shipCount(tp.ships) - (tp.ships.solarSatellite || 0);
  const chance = Math.min(0.95, 0.02 * n * Math.sqrt(defShips) * 2 ** (-d)) * (1 - 0.25 * off('spymaster'));
  body += `<p class="small muted">Chance of counter-espionage: ${Math.round(chance * 100)}%</p>`;
  const msg = addMessage('spy', `Spy report: ${esc(tp.name)}${tp.isMoon ? ' (moon)' : ''} ${coordStr(tp)}`, body, t);
  // Snapshot for the battle simulator (only what the report actually revealed).
  if (info >= 3) {
    msg.data = {
      name: tp.name + (tp.isMoon ? ' (moon)' : ''), coords: { g: tp.g, s: tp.s, p: tp.p }, type: tp.isMoon ? 'moon' : 'planet',
      units: { ...(info >= 2 ? clean(tp.ships) : {}), ...Object.fromEntries(Object.entries(clean(tp.defense)).filter(([id]) => !isMissile(id))) },
      tech: { weaponsTech: techOf(tp.owner).weaponsTech || 0, shieldingTech: techOf(tp.owner).shieldingTech || 0, armourTech: techOf(tp.owner).armourTech || 0 },
      res: { ...tp.res },
    };
    msg.body = msg.body.replace('SIMID', msg.id);
  }
  if (Math.random() < chance) battleAtPlanet(f, tp, t);
}

function recycle(f, t) {
  const k = key(f.to.g, f.to.s, f.to.p), d = S.debris[k];
  const cap = (f.ships.recycler || 0) * SHIPS.recycler.cargo;
  let got = { metal: 0, crystal: 0 };
  if (d) {
    const half = cap / 2;
    got.metal = Math.min(d.metal, half); got.crystal = Math.min(d.crystal, cap - got.metal);
    got.metal = Math.min(d.metal, cap - got.crystal);
    d.metal -= got.metal; d.crystal -= got.crystal;
    if (d.metal + d.crystal < 1) delete S.debris[k];
  }
  f.cargo.metal += got.metal; f.cargo.crystal += got.crystal;
  S.stats.harvested += got.metal + got.crystal;
  addMessage('fleet', `Harvest at ${coordStr(f.to)}`, `<p>Your ${fmt(f.ships.recycler || 0)} Salvagers (hold ${fmt(cap)}) collected ${resLine(got)}.</p>`, t);
}

function colonize(f, t) {
  const tp = planetAt(f.to);
  if (tp || S.playerPlanets.length >= maxColonies()) {
    addMessage('fleet', `Colonization failed ${coordStr(f.to)}`, `<p>${tp ? 'The slot was already settled when the ark arrived.' : 'Astrophysics does not allow another colony.'} The fleet turns home.</p>`, t);
    return startReturn(f, t);
  }
  const pl = makePlanet('player', f.to.g, f.to.s, f.to.p, Math.random, 'Colony');
  pl.res = { metal: 0, crystal: 0, deut: 0 }; pl.last = t;
  S.playerPlanets.push(pl.id);
  f.ships.colonyShip -= 1;
  for (const [id, n] of Object.entries(clean(f.ships))) pl.ships[id] = n;
  RES.forEach(r => { pl.res[r] += f.cargo[r]; });
  f.done = true;
  addMessage('fleet', `New colony at ${coordStr(pl)}`, `<p>The Colony Ark touched down. The new colony has ${fmt(pl.fieldsBase)} fields and a surface temperature up to ${pl.tempMax}°C.</p>`, t);
}

function deliver(f, tp, t, stay) {
  updatePlanet(tp, t);
  RES.forEach(r => { tp.res[r] += f.cargo[r]; });
  const delivered = { ...f.cargo };
  f.cargo = { metal: 0, crystal: 0, deut: 0 };
  if (stay) {
    for (const [id, n] of Object.entries(f.ships)) tp.ships[id] = (tp.ships[id] || 0) + n;
    f.done = true;
    addMessage('fleet', `Fleet deployed at ${esc(tp.name)} ${coordStr(tp)}`, `<p>${fmt(shipCount(f.ships))} ships stationed. Unloaded ${resLine(delivered)}.</p>`, t);
  } else {
    addMessage('fleet', `Delivery to ${esc(tp.name)} ${coordStr(tp)}`, `<p>Unloaded ${resLine(delivered)}.</p>`, t);
  }
}

/* Expeditions ------------------------------------------------------- */
const EXP_TEXT = {
  nothing: ['The sensors logged a lot of empty space and one very old radio echo. Nothing else.',
    'A navigation fault had the fleet flying in a slow circle for most of the trip.',
    'The crew catalogued a new nebula and named it after the quartermaster. No material gains.'],
  res: ['Your crew stripped an abandoned mining platform.', 'A drifting asteroid laced with ore was cracked open and hauled aboard.',
    'Cargo pods from a long-dead convoy were found intact.'],
  ships: ['A derelict dock still held working hulls. Engineers got some of them flying again.',
    'A mothballed patrol group answered your old-protocol hail and joined the fleet.'],
  pirates: ['A pack of pirate raiders was waiting in the dust belt.', 'Cut-throats in patched-together hulls opened fire without a word.'],
  aliens: ['Ships of an unknown design dropped out of nowhere and attacked.', 'An armada that matched no records locked weapons on your fleet.'],
  delay: ['A gravity well slingshot the fleet off course. The return trip will take longer.'],
  early: ['A shortcut through a stable rift lets the fleet return sooner than planned.'],
};
function expeditionResolve(f, t) {
  const v = unitsValue(f.ships), value = (v[0] + v[1]) / 1000 * (1 + 0.15 * off('geologist'));
  S.stats.expeditions++;
  // Deep space sometimes pays in Command Credits instead of cargo.
  if (Math.random() < 0.15) {
    const cc = Math.round(rand(20, 60) + Math.sqrt(value) * 4);
    addCredits(cc);
    addMessage('expedition', `Expedition salvage ${coordStr(f.to)}`, `<p>The crew stripped intact command gear from a derelict and sold it on the way home: <b>${fmt(cc)} Command Credits</b>.</p>`, t);
    return startReturn(f, t);
  }
  const roll = Math.random();
  let title = 'Expedition result', body = '', extra = 1;
  const pts = scoreOf('player');
  if (roll < 0.3) body = pick(EXP_TEXT.nothing);
  else if (roll < 0.6) {
    const kind = pick(['metal', 'metal', 'crystal', 'deut']);
    const div = { metal: 1, crystal: 2, deut: 3 }[kind];
    let amt = value * rand(40, 200) / div;
    amt = Math.min(amt, (40000 + pts * 60) / div);
    const free = cargoCap(f.ships) - (f.cargo.metal + f.cargo.crystal + f.cargo.deut);
    amt = Math.floor(Math.max(0, Math.min(amt, free)));
    f.cargo[kind] += amt;
    body = `${pick(EXP_TEXT.res)} <br>Found <span class="rv ${kind}">${RES_LABEL[kind]} ${fmt(amt)}</span>${amt === free ? ' — the holds are full.' : '.'}`;
  } else if (roll < 0.78) {
    const budget = Math.min(value * 1000 * rand(0.1, 0.5), 60000 + pts * 150);
    const pool = ['smallCargo', 'largeCargo', 'lightFighter', 'heavyFighter', 'cruiser', 'battleship', 'espionageProbe']
      .filter(id => { const c = SHIPS[id].cost; return c[0] + c[1] + c[2] < budget; });
    const found = {};
    let left = budget;
    for (let i = 0; i < 6 && pool.length; i++) {
      const id = pick(pool), c = SHIPS[id].cost, one = c[0] + c[1] + c[2];
      const n = Math.floor(left * rand(0.2, 0.6) / one);
      if (n > 0) { found[id] = (found[id] || 0) + n; left -= n * one; }
    }
    for (const [id, n] of Object.entries(found)) f.ships[id] = (f.ships[id] || 0) + n;
    body = Object.keys(found).length ? `${pick(EXP_TEXT.ships)}<br>Joined the fleet: ${Object.entries(found).map(([id, n]) => `${fmt(n)} ${esc(SHIPS[id].name)}`).join(', ')}.` : pick(EXP_TEXT.nothing);
  } else if (roll < 0.92) {
    const aliens = roll > 0.87;
    const owner = aliens ? 'aliens' : 'pirates';
    const budget = value * 1000 * (aliens ? rand(0.4, 0.9) : rand(0.2, 0.5));
    const enemy = { ships: {} };
    buyUnits(enemy, { metal: budget * 0.6, crystal: budget * 0.3, deut: budget * 0.1 },
      aliens ? [['heavyFighter', 3], ['cruiser', 3], ['battleship', 2]] : [['lightFighter', 5], ['heavyFighter', 3], ['cruiser', 1]], 'ships');
    const my = S.research, off = aliens ? 2 : -3;
    const etech = { weaponsTech: Math.max(0, (my.weaponsTech || 0) + off), shieldingTech: Math.max(0, (my.shieldingTech || 0) + off), armourTech: Math.max(0, (my.armourTech || 0) + off) };
    const before = { ...f.ships };
    const r = simulateCombat(enemy.ships, etech, before, my);
    f.ships = clean(r.defAfter);
    title = aliens ? 'Expedition ambushed' : 'Expedition attacked by pirates';
    body = `<p>${pick(aliens ? EXP_TEXT.aliens : EXP_TEXT.pirates)}</p><p class="verdict ${r.winner === 'defender' ? 'good' : 'bad'}">${r.winner === 'defender' ? 'Your fleet won.' : r.winner === 'draw' ? 'The fight broke off undecided.' : 'Your fleet was destroyed.'}</p>
      <div class="report-cols"><section><h4>${esc(ownerName(owner))}</h4>${unitsTable(enemy.ships, r.attAfter)}</section><section><h4>Your expedition</h4>${unitsTable(before, r.defAfter)}</section></div>`;
  } else if (roll < 0.97) { extra = rand(1.5, 3); body = pick(EXP_TEXT.delay); }
  else { extra = 0.5; body = pick(EXP_TEXT.early); }
  addMessage('expedition', title + ` ${coordStr(f.to)}`, `<p>${body}</p>`, t);
  if (!shipCount(f.ships)) { f.done = true; return; }
  startReturn(f, t, extra);
}

/* Factions ----------------------------------------------------------
 * Hitting a faction's members costs you standing with them and earns a
 * little with their rival. Hit your own faction and you are expelled. */
function adjustRep(facId, delta, t = gameNow()) {
  if (!facId || !delta) return;
  S.rep[facId] = clamp((S.rep[facId] || 0) + delta, -100, 100);
  const rival = FACTION[facId].rival;
  S.rep[rival] = clamp((S.rep[rival] || 0) - delta * 0.5, -100, 100);
  if (S.faction === facId && delta < 0) {
    S.faction = null;
    S.rep[facId] = Math.min(S.rep[facId], 0);
    addMessage('news', `Expelled from ${esc(FACTION[facId].name)}`, '<p>You attacked your own. The pact is void and their perk is gone.</p>', t);
  }
}
function joinFaction(id) {
  const f = FACTION[id];
  if (S.faction === id) return fail(`You already fly with ${f.name}.`);
  if ((S.rep[id] || 0) < JOIN_REP) return fail(`${f.name} wants standing of ${JOIN_REP}; you have ${Math.round(S.rep[id] || 0)}. Raid their rival, ${FACTION[f.rival].name}, to earn it.`);
  S.faction = id;
  markDirty();
  return OK;
}
function leaveFaction() { S.faction = null; markDirty(); }
const factionMembers = id => Object.values(S.npcs).filter(n => n.faction === id).length;

/* Moon systems: sensor phalanx and jump gate ------------------------ */
const PHALANX_COST = 5000;
const phalanxRange = moon => Math.max(0, lv(moon, 'sensorPhalanx') ** 2 - 1);
function phalanxScan(moon, target) {
  if (!moon || !moon.isMoon || !lv(moon, 'sensorPhalanx')) return fail('This needs a moon with a Sensor Phalanx.');
  if (target.g !== moon.g || Math.abs(target.s - moon.s) > phalanxRange(moon)) return fail(`Out of range. This phalanx reaches ${phalanxRange(moon)} systems in galaxy ${moon.g}.`);
  if (moon.res.deut < PHALANX_COST) return fail(`A scan costs ${fmt(PHALANX_COST)} deuterium, and the moon holds ${fmt(Math.floor(moon.res.deut))}.`);
  moon.res.deut -= PHALANX_COST;
  const hits = S.fleets.filter(f => [f.from, f.to].some(c => c.g === target.g && c.s === target.s && c.p === target.p));
  markDirty();
  return { ok: true, fleets: hits };
}
const gateCooldown = moon => Math.max(60000, (60 - 5 * (lv(moon, 'jumpGate') - 1)) * 60000 / S.speed);
function jumpShips(from, to, ships) {
  if (!lv(from, 'jumpGate') || !lv(to, 'jumpGate')) return fail('Both moons need a Jump Gate.');
  const now = gameNow();
  if ((from.gateReady || 0) > now) return fail(`This gate is recharging: ${fmtDur(from.gateReady - now)} left.`);
  if ((to.gateReady || 0) > now) return fail(`The destination gate is recharging: ${fmtDur(to.gateReady - now)} left.`);
  ships = clean(ships);
  if (!shipCount(ships)) return fail('Select ships to send through.');
  for (const [id, n] of Object.entries(ships)) if ((from.ships[id] || 0) < n) return fail(`Not enough ${SHIPS[id].name} on this moon.`);
  for (const [id, n] of Object.entries(ships)) { from.ships[id] -= n; to.ships[id] = (to.ships[id] || 0) + n; }
  from.gateReady = now + gateCooldown(from); to.gateReady = now + gateCooldown(to);
  markDirty();
  return OK;
}

/* Interplanetary missiles ------------------------------------------ */
const missileRange = () => Math.max(0, (S.research.impulseDrive || 0) * 5 - 1);
function launchMissiles(p, target, count) {
  const have = p.defense.interplanetaryMissile || 0;
  count = Math.min(Math.floor(count), have);
  if (!(count > 0)) return fail('No Interplanetary Missiles in the silo.');
  if (target.g !== p.g) return fail('Missiles cannot cross galaxies.');
  if (Math.abs(target.s - p.s) > missileRange()) return fail(`Out of range. Impulse Drive ${S.research.impulseDrive || 0} reaches ${missileRange()} systems.`);
  const tp = planetAt(target);
  if (!tp || tp.owner === 'player') return fail('Pick an enemy planet in range.');
  const now = gameNow();
  p.defense.interplanetaryMissile = have - count;
  S.missiles.push({ id: 'I' + (S.nextId++), from: { g: p.g, s: p.s, p: p.p }, fromId: p.id, to: target, count,
    arrive: now + (30 + 60 * Math.abs(target.s - p.s)) * 1000 / S.speed });
  markDirty();
  return OK;
}
function missileImpact(mi, t) {
  const tp = planetAt(mi.to);
  mi.done = true;
  if (!tp) return;
  updatePlanet(tp, t);
  const abm = tp.defense.antiBallisticMissile || 0;
  const shot = Math.min(abm, mi.count);
  tp.defense.antiBallisticMissile = abm - shot;
  const live = mi.count - shot;
  const tech = techOf(tp.owner), defTech = techOf(tp.owner);
  let pool = live * DEFENSE.interplanetaryMissile.weapon * (1 + 0.1 * (S.research.weaponsTech || 0));
  const destroyed = {};
  // Missiles chew through defenses, weakest first. Shields soak part of each hit.
  const order = Object.keys(DEFENSE).filter(id => !isMissile(id) && tp.defense[id] > 0)
    .sort((a, b) => (DEFENSE[a].cost[0] + DEFENSE[a].cost[1]) - (DEFENSE[b].cost[0] + DEFENSE[b].cost[1]));
  for (const id of order) {
    const d = DEFENSE[id];
    const unit = (d.cost[0] + d.cost[1]) / 10 * (1 + 0.1 * (defTech.armourTech || 0)) + d.shield * (1 + 0.1 * (defTech.shieldingTech || 0));
    const n = Math.min(tp.defense[id], Math.floor(pool / unit));
    if (n > 0) { tp.defense[id] -= n; destroyed[id] = n; pool -= n * unit; }
    if (pool < unit) break;
  }
  const lost = unitsValue(destroyed);
  if (Object.keys(destroyed).length) { S.stats.ipmKills++; S.stats.destroyed += lost[0] + lost[1] + lost[2]; }
  addMessage('combat', `Missile strike on ${esc(tp.name)} ${coordStr(tp)}`, `
    <p>${fmt(mi.count)} Interplanetary Missile${mi.count > 1 ? 's' : ''} reached ${esc(tp.name)}. ${shot ? `${fmt(shot)} were shot down by Interceptors.` : 'No interceptors were waiting.'}</p>
    ${live ? (Object.keys(destroyed).length ? `<p>Destroyed: ${Object.entries(destroyed).map(([id, n]) => `${fmt(n)} ${esc(DEF(id).name)}`).join(', ')} — ${fmtShort(lost[0] + lost[1] + lost[2])} resources of defense.</p>`
      : '<p>The warheads hit empty ground. Nothing was destroyed.</p>') : ''}`, t);
  markDirty();
}

/* Tribute demands ---------------------------------------------------
 * A strong hostile empire offers to leave you alone for a while — for a
 * price. Paying buys a real truce; refusing brings their fleet sooner. */
function scheduleTribute(t) { S.nextTribute = t + rand(24, 60) * HOUR / Math.sqrt(S.speed); }
function demandTribute(t) {
  scheduleTribute(t);
  if (!S.options.raids) return;
  const pts = scoreOf('player');
  if (pts < 3000) return;
  if (S.tributes.some(x => !x.answered)) return;
  const pool = Object.values(S.npcs).filter(n => n.status === 'aggressive' && n.planets.length && (n.truce || 0) < t && npcPoints(n.id) > pts * 0.6);
  if (!pool.length) return;
  const npc = pick(pool);
  const want = {};
  RES.forEach(r => { want[r] = Math.floor(playerPlanets().reduce((a, p) => a + p.res[r], 0) * rand(0.08, 0.16)); });
  if (want.metal + want.crystal + want.deut < 10000) return;
  const deadline = t + 2 * HOUR / Math.sqrt(S.speed);
  const rec = { id: 'T' + (S.nextId++), npc: npc.id, want, deadline, answered: false };
  S.tributes.push(rec);
  addMessage('news', `${esc(npc.name)} demands tribute`, `
    <p><b>${esc(npc.name)}</b> will keep their fleets away from your systems for a while in exchange for ${resLine(want)}.</p>
    <p class="small muted">Answer before ${fmtClock(deadline)} — silence counts as a refusal. Payment is taken from your planets, largest stockpile first.</p>
    <p class="actions-row"><button class="btn" data-act="tribute" data-id="${rec.id}" data-answer="pay">Pay the tribute</button>
      <button class="btn ghost" data-act="tribute" data-id="${rec.id}" data-answer="refuse">Refuse</button></p>`, t);
}
function answerTribute(id, answer) {
  const rec = S.tributes.find(x => x.id === id);
  if (!rec || rec.answered) return fail('That demand has already been settled.');
  const npc = S.npcs[rec.npc], now = gameNow();
  if (answer === 'pay') {
    const planets = playerWorlds();
    planets.forEach(p => updatePlanet(p, now));
    for (const r of RES) {
      let left = rec.want[r];
      for (const p of [...planets].sort((a, b) => b.res[r] - a.res[r])) {
        const take = Math.min(p.res[r], left);
        p.res[r] -= take; left -= take;
        if (left <= 0) break;
      }
      if (left > 1) return fail(`Not enough ${RES_LABEL[r].toLowerCase()} across your planets to pay this.`);
    }
    rec.answered = 'paid';
    npc.truce = now + 24 * HOUR / Math.sqrt(S.speed);
    S.heat[npc.id] = 0;
    addMessage('news', `Tribute paid to ${esc(npc.name)}`, `<p>The convoy left with ${resLine(rec.want)}. ${esc(npc.name)} will leave your systems alone until ${fmtStamp(npc.truce)}.</p>`, now);
  } else {
    rec.answered = 'refused';
    S.heat[npc.id] = (S.heat[npc.id] || 0) + 30000;
    S.nextRaid = Math.min(S.nextRaid, now + 10 * 60000);
    addMessage('news', `You refused ${esc(npc.name)}`, `<p>Their envoy left without an answer worth hearing. Their fleet is being prepared — check your defenses.</p>`, now);
  }
  markDirty();
  return OK;
}

/* NPC raids on the player ------------------------------------------ */
// Difficulty tunes how often hostiles come, how big the fleet is, and how
// long the beginner grace period lasts.
const DIFFICULTY = {
  easy:   { raid: 0.6, gap: 1.6, grace: 1500, label: 'Relaxed' },
  normal: { raid: 1.0, gap: 1.0, grace: 600, label: 'Standard' },
  hard:   { raid: 1.35, gap: 0.8, grace: 400, label: 'Brutal' },
};
const diff = () => DIFFICULTY[S.options.difficulty] || DIFFICULTY.normal;
function scheduleRaid(t) { S.nextRaid = t + rand(6, 20) * diff().gap * HOUR / Math.sqrt(S.speed); }
function launchRaid(t) {
  scheduleRaid(t);
  if (!S.options.raids) return;
  const pts = scoreOf('player');
  if (pts < diff().grace) return; // beginner grace period
  const target = pick(playerWorlds());
  updatePlanet(target, t);
  // Nearby hostiles, plus anyone holding a grudge against you.
  const candidates = Object.values(S.npcs).filter(n => n.status === 'aggressive' && n.planets.length && (n.truce || 0) < t)
    .map(n => ({ n, home: S.planets[n.planets[0]] })).filter(c => c.home)
    .sort((a, b) => (distance(a.home, target) - (S.heat[a.n.id] || 0) * 2) - (distance(b.home, target) - (S.heat[b.n.id] || 0) * 2)).slice(0, 6);
  if (!candidates.length) return;
  const { n: npc, home } = pick(candidates);
  const defVal = unitsValue({ ...clean(target.ships), ...clean(target.defense) });
  // Scaled to whatever is actually defending the target, so raids stay a
  // real threat as your defenses grow.
  const budget = Math.max(pts * 1000 * rand(0.12, 0.28), (defVal[0] + defVal[1] + defVal[2]) * rand(1.1, 2.4)) * diff().raid;
  const raid = { ships: {} };
  const tier = Math.min(3, tierOf(pts * 2));
  // Raiders bring hulls that chew through fixed defenses, not just fighters.
  const RAID_MIX = [
    [['lightFighter', 6], ['heavyFighter', 2]],
    [['lightFighter', 3], ['heavyFighter', 3], ['cruiser', 4]],
    [['cruiser', 4], ['battleship', 3], ['bomber', 3]],
    [['battleship', 3], ['battlecruiser', 3], ['bomber', 3], ['destroyer', 1]],
  ][tier];
  buyUnits(raid, { metal: budget * 0.6, crystal: budget * 0.3, deut: budget * 0.1 }, RAID_MIX, 'ships');
  const lootable = (target.res.metal + target.res.crystal + target.res.deut) / 2;
  raid.ships.largeCargo = (raid.ships.largeCargo || 0) + Math.ceil(lootable / 25000);
  if (!shipCount(raid.ships)) return;
  const dur = Math.max(5 * 60000, flightTime(distance(home, target), slowestSpeed(raid.ships, npc.tech), 100));
  S.fleets.push({ id: 'F' + (S.nextId++), owner: npc.id, hostile: true, mission: 'attack', from: { g: home.g, s: home.s, p: home.p }, fromId: home.id,
    to: { g: target.g, s: target.s, p: target.p }, ships: clean(raid.ships), cargo: { metal: 0, crystal: 0, deut: 0 }, depart: t, arrive: t + dur, oneWay: dur, state: 'outbound', speed: 100 });
  addMessage('system', `Hostile fleet inbound to ${esc(target.name)}`, `<p><b>${esc(npc.name)}</b> launched ${fmt(shipCount(raid.ships))} ships from ${coordStr(home)}. Impact at ${fmtClock(t + dur)}. Build defenses, or fly your fleet out of harm's way.</p>`, t);
}

/* Arrival / return dispatcher --------------------------------------- */
function fleetEvent(f, t) {
  if (f.state === 'return') return fleetHome(f, t);
  if (f.state === 'hold') return expeditionResolve(f, t);
  const tp = bodyAt(f.to, f.targetType || 'planet');
  switch (f.mission) {
    case 'attack': {
      if (!tp) { startReturn(f, t); break; }
      // Everything of yours that lands here at the same moment fights as one force.
      const group = S.fleets.filter(x => !x.done && x.owner === f.owner && x.mission === 'attack' && x.state === 'outbound'
        && x.arrive <= t && (x.targetType || 'planet') === (f.targetType || 'planet')
        && x.to.g === f.to.g && x.to.s === f.to.s && x.to.p === f.to.p);
      if (group.length > 1) groupAttack(group, tp, t); else {
        battleAtPlanet(f, tp, t);
        if (!shipCount(f.ships)) f.done = true; else startReturn(f, t);
      }
      break;
    }
    case 'espionage':
      if (tp) espionage(f, tp, t);
      if (!shipCount(f.ships)) f.done = true; else startReturn(f, t);
      break;
    case 'transport':
      if (tp) deliver(f, tp, t, false);
      startReturn(f, t); break;
    case 'deploy':
      if (tp && tp.owner === 'player') deliver(f, tp, t, true); else startReturn(f, t);
      break;
    case 'colonize': colonize(f, t); break;
    case 'recycle': recycle(f, t); startReturn(f, t); break;
    case 'expedition':
      f.state = 'hold'; f.depart = t; f.arrive = t + HOUR / S.speed; break;
    default: startReturn(f, t);
  }
}
/* Several of your fleets arriving together: merge, fight once, then
 * hand survivors and loot back out in proportion to what each sent. */
function groupAttack(group, tp, t) {
  const merged = {}, sent = {};
  for (const f of group) for (const [id, n] of Object.entries(f.ships)) { merged[id] = (merged[id] || 0) + n; sent[id] = merged[id]; }
  const combined = { owner: group[0].owner, ships: merged, cargo: { metal: 0, crystal: 0, deut: 0 }, from: group[0].from };
  battleAtPlanet(combined, tp, t);
  const totalCargo = group.reduce((a, f) => a + cargoCap(f.ships), 0) || 1;
  for (const f of group) {
    const shareBase = cargoCap(f.ships) / totalCargo;
    const before = { ...f.ships };
    f.ships = {};
    for (const [id, left] of Object.entries(combined.ships)) {
      const mine = Math.floor(left * ((before[id] || 0) / (sent[id] || 1)));
      if (mine > 0) f.ships[id] = mine;
    }
    RES.forEach(r => { f.cargo[r] += Math.floor(combined.cargo[r] * shareBase); });
    if (!shipCount(f.ships)) f.done = true; else startReturn(f, t);
  }
  addMessage('fleet', `Joint attack on ${esc(tp.name)} ${coordStr(tp)}`,
    `<p>${group.length} of your fleets struck together with ${fmt(shipCount(merged))} ships. The combat report has the details.</p>`, t);
}
function fleetHome(f, t) {
  f.done = true;
  const home = S.planets[f.fromId];
  if (f.owner !== 'player') { if (home) for (const [id, n] of Object.entries(f.ships)) home.ships[id] = (home.ships[id] || 0) + n; return; }
  const p = home && home.owner === 'player' ? home : playerPlanets()[0];
  updatePlanet(p, t);
  for (const [id, n] of Object.entries(f.ships)) p.ships[id] = (p.ships[id] || 0) + n;
  RES.forEach(r => { p.res[r] += f.cargo[r]; });
  const got = f.cargo.metal + f.cargo.crystal + f.cargo.deut;
  // Routine empty returns (a delivered transport, a scout) need no message.
  if (f.mission !== 'espionage' && !(got === 0 && (f.mission === 'transport' || f.mission === 'recycle')))
    addMessage('fleet', `Fleet returned to ${esc(p.name)}`, `<p>${fmt(shipCount(f.ships))} ships landed${got ? ` carrying ${resLine(f.cargo)}` : ''}.</p>`, t);
}

/* ---------------------------------------------------------------------
 * SECTION: engine
 * advance(now) replays every event (building done, research done, fleet
 * arrival, NPC tick, raid) in time order up to `now`. Because each
 * planet accrues resources up to the exact event time first, the same
 * code handles both the live 1-second tick and "you were away 9 hours".
 * ------------------------------------------------------------------- */
let dirty = true;
function markDirty() { dirty = true; }

function nextEvent() {
  let best = null;
  const consider = (t, run) => { if (best === null || t < best.t) best = { t, run }; };
  for (const p of playerPlanets()) {
    const q = p.buildQueue[0];
    if (q) consider(q.end, t => {
      updatePlanet(p, t);
      p.buildQueue.shift();
      p.buildings[q.id] = q.level;
      if (p.buildQueue[0]) startBuild(p, p.buildQueue[0], t);
      markDirty();
    });
  }
  if (S.researching) consider(S.researching.end, t => {
    const r = S.researching;
    S.research[r.id] = r.level; S.researching = null;
    addMessage('system', `Research complete: ${RESEARCH[r.id].name} ${r.level}`, `<p>${esc(RESEARCH[r.id].desc)}</p>`, t);
  });
  for (const f of S.fleets) if (!f.done) consider(f.arrive, t => fleetEvent(f, t));
  for (const mi of S.missiles) if (!mi.done) consider(mi.arrive, t => missileImpact(mi, t));
  consider(S.nextNpcTick, npcTick);
  consider(S.nextRaid, launchRaid);
  consider(S.nextTribute, demandTribute);
  // An unanswered tribute demand counts as a refusal once it expires.
  for (const rec of S.tributes) if (!rec.answered) consider(rec.deadline, t => {
    rec.answered = 'ignored';
    S.heat[rec.npc] = (S.heat[rec.npc] || 0) + 20000;
    addMessage('news', `${esc(ownerName(rec.npc))} got no answer`, '<p>The deadline passed in silence. They have taken that as a refusal.</p>', t);
  });
  return best;
}

function advance(now) {
  for (let guard = 0; guard < 20000; guard++) {
    const ev = nextEvent();
    if (!ev || ev.t > now) break;
    ev.run(ev.t);
    if (S.fleets.some(f => f.done)) { S.fleets = S.fleets.filter(f => !f.done); markDirty(); }
    if (S.missiles.some(m => m.done)) S.missiles = S.missiles.filter(m => !m.done);
  }
  for (const p of playerPlanets()) updatePlanet(p, now);
}

/* Saving: localStorage (per browser) + manual export/import strings. */
/* Three save slots. Slot 1 keeps the original key so older saves load. */
const SLOTS = [1, 2, 3];
const slotKey = n => n === 1 ? 'stellar-dominion-save-v1' : `stellar-dominion-save-v1-s${n}`;
const metaKey = n => slotKey(n) + '-meta';
const SAVE_KEY = slotKey(1);
let storageOK = true;
let currentSlot = 1;
function saveGame(slot = currentSlot) {
  if (!S) return;
  try {
    localStorage.setItem(slotKey(slot), JSON.stringify(S));
    localStorage.setItem(metaKey(slot), JSON.stringify({ commander: S.commander, speed: S.speed, points: scoreOf('player'), planets: S.playerPlanets.length, t: Date.now() }));
    storageOK = true;
  } catch (e) { storageOK = false; }
}
function loadGame(slot = currentSlot) {
  try { const raw = localStorage.getItem(slotKey(slot)); return raw ? JSON.parse(raw) : null; }
  catch (e) { storageOK = false; return null; }
}
function slotMeta(slot) {
  try { const raw = localStorage.getItem(metaKey(slot)); return raw ? JSON.parse(raw) : (localStorage.getItem(slotKey(slot)) ? { unknown: true } : null); }
  catch (e) { return null; }
}
function deleteSlot(slot) {
  try { localStorage.removeItem(slotKey(slot)); localStorage.removeItem(metaKey(slot)); } catch (e) { /* storage blocked */ }
}
/* Pausing freezes game time: the offset grows while paused, and every
 * timer reads gameNow(), so nothing ages while you are away on purpose. */
function setPaused(on) {
  if (!S || !!S.paused === !!on) return;
  if (on) { S.paused = true; S.pausedReal = Date.now(); }
  else { S.timeOffset = (S.timeOffset || 0) + (Date.now() - (S.pausedReal || Date.now())); S.paused = false; S.pausedReal = null; }
  markDirty();
}
const exportSave = () => btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function importSave(str) {
  const obj = JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
  if (!obj || !obj.planets || !obj.playerPlanets) throw new Error('Not a Stellar Dominion save.');
  return obj;
}

function newGame(commander, speed, homeName) {
  const now = gameNow();
  S = {
    v: 1, created: now, speed, commander: commander || 'Commander', seed: (now % 2147483647) | 0,
    planets: {}, slots: {}, moons: {}, npcs: {}, debris: {}, fleets: [], missiles: [], messages: [],
    research: {}, researching: null, playerPlanets: [], current: null, nextId: 1,
    heat: {}, tributes: [], presets: [],
    credits: 0, officers: {}, achievements: {}, objectives: {}, rep: {}, faction: null, history: [],
    timeOffset: 0, paused: false,
    stats: { battlesWon: 0, destroyed: 0, plundered: 0, harvested: 0, expeditions: 0, ipmKills: 0 },
    nextNpcTick: now + NPC_TICK_MS, nextRaid: 0, nextTribute: 0,
    options: { raids: true, probes: 3, difficulty: 'normal' },
    ui: { view: 'overview', gal: null },
  };
  generateUniverse(S.seed, homeName);
